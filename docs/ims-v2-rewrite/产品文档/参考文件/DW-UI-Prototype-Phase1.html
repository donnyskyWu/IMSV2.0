<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易版数据仓库 Lite DW - 一期原型（核心数据建设与自助分析）</title>
<style>
:root{--primary:#409eff;--success:#67c23a;--warning:#e6a23c;--danger:#f56c6c;--info:#909399;--purple:#7c3aed;--text1:#303133;--text2:#606266;--text3:#909399;--text4:#c0c4cc;--bd:#dcdfe6;--bdl:#e4e7ed;--bdll:#ebeef5;--bg:#fff;--bgp:#f5f7fa;--fs12:12px;--fs14:14px;--fs16:16px;--sw:220px;--hh:56px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;font-size:var(--fs14);color:var(--text1);background:var(--bgp)}
button{cursor:pointer;border:none;outline:none;font-family:inherit;background:none}
input,select,textarea{font-family:inherit;font-size:var(--fs14);color:var(--text1)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#c0c4cc;border-radius:3px}
/* Login */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
.login-card{background:#fff;border-radius:12px;padding:48px 40px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.login-card h2{text-align:center;margin-bottom:8px;font-size:24px}
.login-card .sub{text-align:center;color:var(--text3);margin-bottom:32px;font-size:var(--fs12)}
.login-form .fi{margin-bottom:20px}
.login-form label{display:block;margin-bottom:6px;color:var(--text2)}
.login-form input{width:100%;height:40px;border:1px solid var(--bd);border-radius:6px;padding:0 12px}
.login-form input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 2px rgba(64,158,255,.1)}
.login-btn{width:100%;height:42px;background:var(--primary);color:#fff;border-radius:6px;font-size:16px;font-weight:500}
.login-btn:hover{background:#66b1ff}
.login-hint{text-align:center;margin-top:16px;font-size:var(--fs12);color:var(--text3)}
/* Layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:#001529;color:#fff;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.sidebar-logo{height:var(--hh);display:flex;align-items:center;padding:0 16px;font-size:17px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .lg{width:28px;height:28px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin-right:10px;font-size:14px}
.menu-group-title{padding:14px 16px 4px;font-size:var(--fs12);color:rgba(255,255,255,.4);letter-spacing:1px}
.menu-item{display:flex;align-items:center;padding:10px 16px 10px 24px;color:rgba(255,255,255,.65);cursor:pointer;transition:all .2s;border-left:3px solid transparent;font-size:var(--fs14)}
.menu-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.menu-item.active{color:#fff;background:var(--primary);border-left-color:var(--primary)}
.menu-item .ic{width:20px;margin-right:10px;text-align:center}
.menu-item .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;padding:1px 6px;border-radius:10px}
.main-area{flex:1;margin-left:var(--sw)}
.header{height:var(--hh);background:var(--bg);border-bottom:1px solid var(--bdll);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50}
.breadcrumb{display:flex;gap:8px;color:var(--text3);align-items:center}
.breadcrumb b{color:var(--text1);font-weight:600}
.header-right{display:flex;align-items:center;gap:16px}
.hd-icon{font-size:18px;cursor:pointer;position:relative}
.hd-icon .dot{position:absolute;top:-2px;right:-4px;width:8px;height:8px;background:var(--danger);border-radius:50%}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:var(--fs12);font-weight:600;cursor:pointer}
.content{padding:24px;min-height:calc(100vh - var(--hh))}
/* Common */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:20px;font-weight:600}
.back-btn{display:inline-flex;align-items:center;gap:4px;color:var(--primary);cursor:pointer;margin-bottom:16px;font-size:var(--fs14)}
.back-btn:hover{opacity:.8}
.search-bar{background:var(--bg);border-radius:8px;padding:16px 20px;margin-bottom:16px;border:1px solid var(--bdll)}
.search-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.search-row .field{display:flex;flex-direction:column;gap:4px}
.search-row label{font-size:var(--fs12);color:var(--text3)}
.search-row input,.search-row select{height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 8px;min-width:140px;background:#fff}
.search-row input:focus,.search-row select:focus{border-color:var(--primary);outline:none}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 15px;border-radius:4px;font-size:var(--fs14);border:1px solid var(--bd);background:var(--bg);color:var(--text2);transition:all .2s;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#66b1ff;color:#fff}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-success:hover{background:#85ce61;color:#fff}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-danger:hover{background:#f78989;color:#fff}
.btn-warning{background:var(--warning);color:#fff;border-color:var(--warning)}
.btn-sm{height:26px;padding:0 10px;font-size:var(--fs12)}
.btn-text{border:none;background:none;color:var(--primary);padding:0 4px;height:auto;font-size:var(--fs12)}
.btn-text:hover{color:#66b1ff}
.btn-text.danger{color:var(--danger)}
.btn-text.warning{color:var(--warning)}
/* Table */
.tbl-wrap{background:var(--bg);border-radius:8px;border:1px solid var(--bdll);overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#fafafa;font-weight:600;font-size:var(--fs12);color:var(--text2);text-align:left;padding:12px;border-bottom:1px solid var(--bdll);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--bdll);font-size:var(--fs14);color:var(--text2);word-break:break-all}
tbody tr:hover td{background:#fafafa}
tbody tr:last-child td{border-bottom:none}
.link{color:var(--primary);cursor:pointer}.link:hover{opacity:.8}
.muted{color:var(--text3);font-size:var(--fs12)}
/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:var(--fs12);line-height:1.5;white-space:nowrap}
.tag-primary{background:#ecf5ff;color:var(--primary)}
.tag-success{background:#f0f9eb;color:var(--success)}
.tag-warning{background:#fdf6ec;color:var(--warning)}
.tag-danger{background:#fef0f0;color:var(--danger)}
.tag-info{background:#f4f4f5;color:var(--info)}
.tag-purple{background:#f3e8ff;color:var(--purple)}
.tag-dark{background:#e8e8e8;color:#595959}
/* Switch */
.switch{position:relative;width:40px;height:20px;border-radius:10px;background:#dcdfe6;cursor:pointer;transition:background .2s;display:inline-block;vertical-align:middle}
.switch.on{background:var(--primary)}
.switch::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on::after{left:22px}
/* Tabs */
.tab-group{margin-bottom:16px}
.tabs{display:flex;border-bottom:2px solid var(--bdll)}
.tab{padding:10px 20px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-size:var(--fs14)}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-pane{display:none;padding-top:16px}
.tab-pane.active{display:block}
/* Pagination */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 0;font-size:var(--fs12)}
.pg-btn{min-width:32px;height:32px;border:1px solid var(--bd);border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);color:var(--text2)}
.pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg-info{color:var(--text3);margin-right:8px}
.pg-sel{height:28px;border:1px solid var(--bd);border-radius:4px}
/* Modal */
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:var(--bg);border-radius:8px;width:640px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.18);animation:zoomIn .18s}
.modal.sm{width:420px}.modal.lg{width:960px}.modal.xl{width:1200px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bdll)}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{font-size:20px;cursor:pointer;color:var(--text3)}
.modal-close:hover{color:var(--text1)}
.modal-body{padding:24px;overflow-y:auto}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--bdll)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
/* Drawer */
.drawer-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;animation:fadeIn .15s}
.drawer{position:fixed;top:0;right:0;width:720px;max-width:92vw;height:100vh;background:var(--bg);z-index:1001;overflow-y:auto;box-shadow:-4px 0 20px rgba(0,0,0,.12);animation:slideIn .25s}
.drawer.wide{width:960px}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bdll);position:sticky;top:0;background:var(--bg);z-index:1}
.drawer-header h3{font-size:16px;font-weight:600}
.drawer-body{padding:24px}
/* Form */
.form-sec{background:var(--bg);border:1px solid var(--bdll);border-radius:8px;padding:20px;margin-bottom:16px}
.form-sec-title{font-size:15px;font-weight:600;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bdll);color:var(--text1)}
.form-group{margin-bottom:18px}
.form-group>label{display:block;margin-bottom:6px;font-size:var(--fs14);color:var(--text2)}
.req{color:var(--danger);margin-right:2px}
.form-row{display:flex;gap:16px}
.form-row>.form-group{flex:1;min-width:0}
.form-input,.form-select{width:100%;height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 10px;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--primary);outline:none}
.form-textarea{width:100%;min-height:80px;border:1px solid var(--bd);border-radius:4px;padding:8px 10px;resize:vertical}
.form-hint{font-size:var(--fs12);color:var(--text3);margin-top:4px}
.radio-group{display:flex;gap:20px;flex-wrap:wrap}
.radio-item{display:flex;align-items:center;gap:6px;cursor:pointer}
.radio-item input{accent-color:var(--primary)}
.check-item{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:var(--fs14)}
.check-item input{accent-color:var(--primary)}
.form-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:16px;border-top:1px solid var(--bdll)}
/* Cards */
.card{background:var(--bg);border-radius:8px;border:1px solid var(--bdll);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdll)}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg);border-radius:8px;padding:20px;border:1px solid var(--bdll);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.stat-card.sc-success::before{background:var(--success)}
.stat-card.sc-warning::before{background:var(--warning)}
.stat-card.sc-danger::before{background:var(--danger)}
.stat-card.sc-purple::before{background:var(--purple)}
.stat-card .label{font-size:var(--fs12);color:var(--text3);margin-bottom:8px}
.stat-card .value{font-size:26px;font-weight:700;color:var(--text1)}
.stat-card .foot{font-size:var(--fs12);margin-top:6px;color:var(--text3)}
/* Grid2 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* Confirm */
.confirm-body{padding:28px 24px;text-align:center}
.confirm-body .cicon{font-size:44px;margin-bottom:14px}
.confirm-body .ctitle{font-size:16px;margin-bottom:8px;font-weight:600}
.confirm-body .cdesc{color:var(--text3);margin-bottom:22px;line-height:1.6}
/* Code */
.code-block{background:#1e1e2e;color:#d4d4d4;padding:14px 16px;border-radius:6px;font-family:Consolas,Monaco,monospace;font-size:12px;overflow-x:auto;white-space:pre-wrap;line-height:1.7}
.code-inline{background:#f0f2f5;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:12px;color:var(--primary)}
/* KV desc */
.kv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:var(--fs12);color:var(--text3)}
.kv .v{font-size:var(--fs14);color:var(--text1)}
/* Toast */
.toast{position:fixed;top:70px;right:24px;z-index:3000;padding:10px 18px;border-radius:6px;color:#fff;font-size:var(--fs14);box-shadow:0 4px 16px rgba(0,0,0,.15);transform:translateX(120%);transition:transform .25s}
.toast.show{transform:translateX(0)}
.toast-success{background:var(--success)}
.toast-error{background:var(--danger)}
.toast-warning{background:var(--warning)}
.toast-info{background:var(--primary)}
/* Log */
.log-box{background:#1a1a2e;color:#e0e0e0;border-radius:8px;padding:16px;font-family:Consolas,monospace;font-size:12px;max-height:460px;overflow-y:auto;line-height:1.8}
.log-line{padding:1px 0}
.log-line .lt{color:#7a7a9e;margin-right:10px}
.lv-info{color:#4fc3f7}.lv-warn{color:#e6a23c}.lv-err{color:#f56c6c}
.log-step{color:#81c784;font-weight:600;margin:8px 0 4px;border-bottom:1px dashed #333;padding-bottom:2px}
/* DAG */
.dag-wrap{position:relative;background:#fafbfc;border:1px solid var(--bdll);border-radius:8px;min-height:560px;overflow:auto;padding:20px}
.dag-node{position:absolute;background:#fff;border:2px solid var(--bd);border-radius:8px;padding:10px 14px;min-width:150px;text-align:center;cursor:pointer;transition:all .15s;z-index:2}
.dag-node:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(64,158,255,.18)}
.dag-node.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(64,158,255,.15)}
.dag-node.running{border-color:var(--primary);background:#ecf5ff}
.dag-node.success{border-color:var(--success);background:#f0f9eb}
.dag-node.failed{border-color:var(--danger);background:#fef0f0}
.dag-node.pending{border-color:var(--bd);background:#fafafa}
.dag-node .nt{font-weight:600;font-size:13px;margin-bottom:3px}
.dag-node .ns{font-size:11px}
/* Tree */
.tree-item{padding:6px 8px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:var(--fs14);color:var(--text2)}
.tree-item:hover{background:#f5f7fa}
.tree-item.active{background:#ecf5ff;color:var(--primary)}
.tree-item .cnt{margin-left:auto;font-size:var(--fs12);color:var(--text3)}
.tree-children{padding-left:20px}
/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--text4)}
.empty .eicon{font-size:48px;margin-bottom:12px}
/* Toolbar chip */
.chip{display:inline-flex;align-items:center;gap:4px;background:#f0f2f5;border-radius:4px;padding:2px 8px;font-size:var(--fs12);color:var(--text2)}
/* Steps */
.steps{display:flex;margin-bottom:24px}
.step{flex:1;text-align:center;position:relative}
.step .snum{width:28px;height:28px;border-radius:50%;background:#e4e7ed;color:var(--text3);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-bottom:6px}
.step.done .snum{background:var(--primary);color:#fff}
.step.cur .snum{background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(64,158,255,.2)}
.step .slbl{font-size:var(--fs12);color:var(--text3)}
.step.cur .slbl{color:var(--primary);font-weight:600}
.step::after{content:'';position:absolute;top:14px;left:calc(50% + 22px);right:calc(-50% + 22px);height:2px;background:#e4e7ed}
.step:last-child::after{display:none}
.step.done::after{background:var(--primary)}
/* Designer */
.designer-top{height:50px;background:var(--bg);border-bottom:1px solid var(--bdll);display:flex;align-items:center;padding:0 16px;gap:8px;position:sticky;top:0;z-index:20}
.designer-body{display:flex;height:calc(100vh - var(--hh) - 50px)}
.dsn-left{width:264px;background:var(--bg);border-right:1px solid var(--bdll);overflow-y:auto;padding:12px;flex-shrink:0}
.dsn-canvas-area{flex:1;overflow:auto;background:#f0f2f5;position:relative}
.dsn-canvas{position:relative;background:#fff;margin:20px auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.dsn-right{width:320px;background:var(--bg);border-left:1px solid var(--bdll);overflow-y:auto;padding:14px;flex-shrink:0}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comp-cell{border:1px solid var(--bdll);border-radius:6px;padding:10px 6px;text-align:center;cursor:grab;font-size:12px;color:var(--text2);transition:all .15s;user-select:none;background:#fff}
.comp-cell:hover{border-color:var(--primary);color:var(--primary);background:#ecf5ff}
.comp-cell .ci{font-size:18px;display:block;margin-bottom:4px}
.comp-group-title{font-size:12px;color:var(--text3);margin:12px 0 8px;font-weight:600;display:flex;align-items:center;gap:6px}
.canvas-comp{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:6px;cursor:move;overflow:hidden}
.canvas-comp.sel{border-color:var(--primary);box-shadow:0 0 0 2px rgba(64,158,255,.25);z-index:10}
.canvas-comp .cc-head{font-size:12px;color:var(--text2);padding:6px 10px;border-bottom:1px solid var(--bdll);background:#fafafa;display:flex;justify-content:space-between}
.canvas-comp .cc-body{display:flex;align-items:center;justify-content:center;height:calc(100% - 27px);color:var(--text4);font-size:12px}
.cc-del{cursor:pointer;color:var(--text3);margin-left:4px}
.cc-del:hover{color:var(--danger)}
.prop-sec{margin-bottom:6px;border:1px solid var(--bdll);border-radius:6px;overflow:hidden}
.prop-head{padding:10px 12px;background:#fafafa;font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.prop-body{padding:12px}
/* Fullscreen dashboard */
.fs-page{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,#132a4d 0%,#0a1628 100%);z-index:2000;color:#fff;overflow:auto}
.fs-head{text-align:center;padding:22px 60px 12px}
.fs-head h1{font-size:26px;font-weight:300;letter-spacing:4px}
.fs-head .fstime{font-size:15px;color:rgba(255,255,255,.55);margin-top:6px}
.fs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 24px}
.fs-kpi{background:linear-gradient(160deg,rgba(79,195,247,.12),rgba(79,195,247,.03));border:1px solid rgba(79,195,247,.25);border-radius:8px;padding:20px 16px;text-align:center}
.fs-kpi .fv{font-size:34px;font-weight:700;color:#4fc3f7;font-family:'DIN Alternate',Consolas,monospace}
.fs-kpi .fl{font-size:13px;color:rgba(255,255,255,.6);margin-top:6px}
.fs-kpi .fc{font-size:12px;margin-top:4px}
.fs-kpi .fc.up{color:#67c23a}.fs-kpi .fc.down{color:#f56c6c}
.fs-chart{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:14px;display:flex;flex-direction:column}
.fs-chart .fct{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:10px;padding-left:8px;border-left:3px solid #4fc3f7}
.fs-exit{position:fixed;top:14px;right:16px;z-index:2001;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer}
.fs-exit:hover{background:rgba(255,255,255,.2)}
/* Chart svg */
.chart-box{background:var(--bg);border:1px solid var(--bdll);border-radius:8px;padding:16px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text1)}
/* Layer panel */
.layer-bar{height:36px;background:var(--bg);border-top:1px solid var(--bdll);display:flex;align-items:center;padding:0 16px;gap:8px;overflow-x:auto}
.layer-item{padding:3px 10px;border:1px solid var(--bdll);border-radius:4px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}
.layer-item:hover,.layer-item.sel{border-color:var(--primary);color:var(--primary)}
/* Dropdown menu */
.dd{position:relative;display:inline-block}
.dd-menu{display:none;position:absolute;top:calc(100% + 4px);right:0;background:#fff;border:1px solid var(--bdl);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:200;min-width:130px;padding:4px}
.dd-menu.show{display:block}
.dd-item{padding:8px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-radius:4px;white-space:nowrap}
.dd-item:hover{background:#f5f7fa;color:var(--primary)}
.dd-item.danger:hover{color:var(--danger)}
/* BI 报表卡片 v2 */
.bi-view-switch{display:inline-flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.bi-view-switch button{padding:5px 12px;background:#fff;border:none;font-size:13px;color:var(--text3);cursor:pointer;transition:all .15s}
.bi-view-switch button:hover{color:var(--primary)}
.bi-view-switch button.on{background:var(--primary);color:#fff}
.bi-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bi-card{background:var(--bg);border:1px solid var(--bdll);border-radius:10px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.bi-card:hover{box-shadow:0 8px 24px rgba(31,45,61,.12);transform:translateY(-3px);border-color:#a0cfff}
.bi-thumb{position:relative;height:148px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.bi-thumb.light{background:linear-gradient(135deg,#f2f7ff 0%,#e9f4f1 100%)}
.bi-thumb.dark{background:linear-gradient(135deg,#1a2f52 0%,#0b1930 100%)}
.bi-thumb svg{transition:transform .3s ease}
.bi-card:hover .bi-thumb svg{transform:scale(1.07)}
.bi-thumb .bi-type{position:absolute;top:10px;left:10px}
.bi-thumb .bi-hacts{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transform:translateY(-4px);transition:all .2s}
.bi-card:hover .bi-hacts{opacity:1;transform:translateY(0)}
.bi-ha{width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,.95);border:none;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);color:var(--text2)}
.bi-ha:hover{background:var(--primary);color:#fff}
.bi-info{padding:14px 16px 12px;flex:1;display:flex;flex-direction:column}
.bi-info h4{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bi-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text3);margin-bottom:10px}
.bi-meta span{display:inline-flex;align-items:center;gap:4px}
.bi-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--bdll);display:flex;align-items:center;justify-content:space-between}
.bi-foot .bi-tags{display:flex;gap:4px}
.bi-list-thumb{width:64px;height:40px;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f2f7ff,#e9f4f1)}
.bi-list-thumb.dark{background:linear-gradient(135deg,#1a2f52,#0b1930)}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h2>Lite DW</h2>
    <p class="sub">简易版数据仓库 · 第一期（核心数据建设与自助分析）· SQL Server + ERP 从库映射</p>
    <div class="login-form">
      <div class="fi"><label>用户名</label><input value="admin" id="loginUser"></div>
      <div class="fi"><label>密码</label><input type="password" value="123456" id="loginPwd"></div>
      <button class="login-btn" onclick="doLogin()">登 录</button>
      <p class="login-hint">默认账号 admin / 123456</p>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div class="app-layout" id="appMain" style="display:none">
  <div class="sidebar">
    <div class="sidebar-logo"><div class="lg">📊</div>Lite DW</div>
    <div id="menuBox"></div>
  </div>
  <div class="main-area">
    <div class="header">
      <div class="breadcrumb" id="crumb"></div>
      <div class="header-right">
        <div class="hd-icon" onclick="toast('暂无新消息','info')">🔔<span class="dot"></span></div>
        <div class="hd-icon" onclick="nav('sy-profile')">❓</div>
        <div class="avatar" onclick="nav('sy-profile')">A</div>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<script>
/* ============================================================
   Lite DW 完整交互原型 —— 路由与通用组件系统
   ============================================================ */
const PAGES = {};
let CUR = {page:'dashboard', params:{}};

const MENU = [
  {g:'总览', items:[
    {id:'dashboard', ic:'📊', t:'监控大盘'},
  ]},
  {g:'数据集成', items:[
    {id:'ds-list', ic:'🔌', t:'数据源管理'},
    {id:'ct-list', ic:'📥', t:'采集任务'},
    {id:'tt-list', ic:'⚙️', t:'加工任务'},
    {id:'sch-list', ic:'⏰', t:'任务调度'},
  ]},
  {g:'数据治理', items:[
    {id:'meta-list', ic:'🗂️', t:'元数据管理'},
    {id:'meta-lineage', ic:'🔗', t:'血缘关系'},
    {id:'meta-changelog', ic:'📜', t:'变更日志'},
    {id:'meta-publish-list', ic:'📢', t:'数据资产发布'},
  ]},
  {g:'数据分析', items:[
    {id:'mt-list', ic:'📈', t:'指标管理'},
    {id:'mt-schedule', ic:'🧮', t:'指标计算调度'},
    {id:'qy-list', ic:'🔍', t:'自定义查询'},
    {id:'bi-list', ic:'📑', t:'BI报表'},
  ]},
  {g:'监控运维', items:[
    {id:'al-rules', ic:'🔔', t:'预警规则', badge:2},
    {id:'al-records', ic:'📋', t:'预警记录', badge:5},
    {id:'sys-logs', ic:'📝', t:'系统日志'},
  ]},
  {g:'个人', items:[
    {id:'sy-profile', ic:'👤', t:'个人中心'},
  ]},
];

const TITLES = {
  'dashboard':'监控大盘',
  'ds-list':'数据源管理','ds-form':'数据源表单',
  'meta-list':'元数据管理','meta-detail':'元数据表详情','meta-mapping':'字段映射编辑','meta-lineage':'血缘关系图','meta-changelog':'变更日志','meta-publish-list':'数据资产发布','meta-publish-form':'数据资产发布表单',
  'ct-list':'采集任务','ct-form':'采集任务配置','ct-detail':'采集任务详情','ct-log':'执行日志',
  'tt-list':'加工任务','tt-form':'加工任务配置','tt-detail':'加工任务详情','tt-dep':'依赖配置（DAG）','tt-version':'版本管理',
  'sch-list':'任务调度','sch-dag':'DAG 可视化','sch-exec':'调度执行历史',
  'al-rules':'预警规则','al-records':'预警记录','sys-logs':'系统操作日志',
  'mt-list':'指标定义','mt-form':'指标定义表单','mt-result':'指标结果查询','mt-category':'指标分类管理','mt-schedule':'指标计算调度',
  'qy-list':'查询配置','qy-editor':'查询编辑器','qy-templates':'查询模板','qy-schedules':'定时查询计划',
  'bi-list':'BI 报表与数据大屏','bi-designer':'报表设计器','bi-preview':'报表预览','bi-publish':'发布管理','bi-published':'报表访问（发布链接）','bi-categories':'分类管理',
  'sy-profile':'个人中心',
};

function doLogin(){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('appMain').style.display='flex';
  renderMenu();
  nav('dashboard');
}
function logout(){
  document.getElementById('appMain').style.display='none';
  document.getElementById('loginPage').style.display='flex';
}
function renderMenu(){
  let h='';
  MENU.forEach(g=>{
    h+=`<div class="menu-group-title">${g.g}</div>`;
    g.items.forEach(it=>{
      h+=`<div class="menu-item" data-p="${it.id}" onclick="nav('${it.id}')"><span class="ic">${it.ic}</span>${it.t}${it.badge?`<span class="badge">${it.badge}</span>`:''}</div>`;
    });
  });
  document.getElementById('menuBox').innerHTML=h;
}
function nav(page, params){
  CUR={page, params:params||{}};
  const fn=PAGES[page];
  const v=document.getElementById('view');
  if(fn){ v.innerHTML=fn(); } else { v.innerHTML=`<div class="empty"><div class="eicon">🚧</div><div>页面开发中：${page}</div></div>`; }
  document.querySelectorAll('.menu-item').forEach(m=>m.classList.toggle('active',m.dataset.p===page));
  const crumb=document.getElementById('crumb');
  const t=TITLES[page]||page;
  if(page==='dashboard'){ crumb.innerHTML=`<span>首页</span><span>/</span><b>${t}</b>`; }
  else{ crumb.innerHTML=`<span style="cursor:pointer" onclick="nav('dashboard')">首页</span><span>/</span><b>${t}</b>`; }
  v.parentElement.querySelector('.content').scrollTop=0;
  window.scrollTo(0,0);
}

/* ============ 通用组件生成器 ============ */
function ph(title, backTo, actions){
  return `<div class="page-header"><div class="page-title">${title}</div><div class="toolbar-left">${actions||''}</div></div>`;
}
function backBtn(to, label){
  return `<div class="back-btn" onclick="nav('${to}')">← 返回${label?(label):'列表'}</div>`;
}
function searchBar(fields){
  let h='<div class="search-bar"><div class="search-row">';
  fields.forEach(f=>{
    if(f.type==='select'){
      h+=`<div class="field"><label>${f.label}</label><select><option value="">全部</option>${f.opts.map(o=>`<option>${o}</option>`).join('')}</select></div>`;
    } else {
      h+=`<div class="field"><label>${f.label}</label><input placeholder="${f.ph||('请输入'+f.label)}"></div>`;
    }
  });
  h+=`<div class="field"><label>&nbsp;</label><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="toast('查询完成','success')">🔍 搜索</button><button class="btn" onclick="toast('已重置','info')">重置</button></div></div>`;
  h+='</div></div>';
  return h;
}
function toolbar(left, right){
  return `<div class="toolbar"><div class="toolbar-left">${left}</div><div class="toolbar-right">${right||'<button class="btn" onclick="toast(\'已刷新\',\'success\')">🔄 刷新</button>'}</div></div>`;
}
function tbl(cols, rows){
  let h='<div class="tbl-wrap"><table><thead><tr>';
  cols.forEach(c=>{ h+=`<th style="${c.w?'width:'+c.w+';':''}${c.c?'text-align:'+c.c:''}">${c.t}</th>`; });
  h+='</tr></thead><tbody>';
  if(rows.length===0){ h+=`<tr><td colspan="${cols.length}" style="text-align:center;padding:40px;color:var(--text4)">暂无数据</td></tr>`; }
  rows.forEach(r=>{
    h+='<tr>';
    r.forEach((cell,i)=>{ h+=`<td${cols[i].c?' style="text-align:'+cols[i].c+'"':''}>${cell}</td>`; });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function pager(total, page){
  page=page||1;
  let h='<div class="pagination"><span class="pg-info">共 '+total+' 条</span>';
  h+='<select class="pg-sel"><option>10 条/页</option><option selected>20 条/页</option><option>50 条/页</option></select>';
  h+='<div class="pg-btn">‹</div>';
  for(let i=1;i<=Math.min(5,Math.ceil(total/20)||1);i++){ h+=`<div class="pg-btn${i===page?' active':''}">${i}</div>`; }
  if(total>100){h+='<div class="pg-btn">…</div>';}
  h+='<div class="pg-btn">›</div></div>';
  return h;
}
function swTab(el, idx){
  const g=el.closest('.tab-group');
  g.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const panes=g.querySelectorAll('.tab-pane');
  panes.forEach((p,i)=>p.classList.toggle('active',i===idx));
}
function tabGroup(tabs, panes){
  return `<div class="tab-group"><div class="tabs">${tabs.map((t,i)=>`<div class="tab${i===0?' active':''}" onclick="swTab(this,${i})">${t}</div>`).join('')}</div>${panes.map((p,i)=>`<div class="tab-pane${i===0?' active':''}">${p}</div>`).join('')}</div>`;
}
function toggleSw(el){ el.classList.toggle('on'); toast('状态已更新','success'); }

/* 弹窗系统 */
function openDlg(title, body, footer, size){
  closeModal();
  const mask=document.createElement('div');
  mask.className='modal-mask'; mask.id='_dlg';
  mask.innerHTML=`<div class="modal ${size||''}"><div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div>`;
  mask.addEventListener('click',e=>{if(e.target===mask)closeModal();});
  document.body.appendChild(mask);
}
function closeModal(){ const d=document.getElementById('_dlg'); if(d)d.remove(); }
function openDrw(title, body, wide){
  closeDrw();
  const mask=document.createElement('div');
  mask.className='drawer-mask'; mask.id='_drwMask';
  mask.addEventListener('click',closeDrw);
  document.body.appendChild(mask);
  const d=document.createElement('div');
  d.className='drawer'+(wide?' wide':''); d.id='_drw';
  d.innerHTML=`<div class="drawer-header"><h3>${title}</h3><button class="modal-close" onclick="closeDrw()">×</button></div><div class="drawer-body">${body}</div>`;
  document.body.appendChild(d);
}
function closeDrw(){ const d=document.getElementById('_drw'); if(d)d.remove(); const m=document.getElementById('_drwMask'); if(m)m.remove(); }
function confirmBox(title, desc, okText, danger){
  openDlg('操作确认', `<div class="confirm-body"><div class="cicon">${danger?'⚠️':'❓'}</div><div class="ctitle">${title}</div><div class="cdesc">${desc}</div><div style="display:flex;gap:10px;justify-content:center"><button class="btn" onclick="closeModal()">取消</button><button class="btn ${danger?'btn-danger':'btn-primary'}" onclick="closeModal();toast('操作成功','success')">${okText||'确定'}</button></div></div>`, null, 'sm');
}
function toast(msg, type){
  type=type||'success';
  const t=document.createElement('div');
  t.className='toast toast-'+type; t.textContent=msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),300);},2000);
}
/* 表单字段 */
function fInput(label, val, req, hint, ph){
  return `<div class="form-group"><label>${req?'<span class="req">*</span>':''}${label}</label><input class="form-input" value="${val||''}" placeholder="${ph||''}">${hint?`<div class="form-hint">${hint}</div>`:''}</div>`;
}
function fSelect(label, val, opts, req, hint){
  return `<div class="form-group"><label>${req?'<span class="req">*</span>':''}${label}</label><select class="form-select">${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>${hint?`<div class="form-hint">${hint}</div>`:''}</div>`;
}
function fTextarea(label, val, req, hint){
  return `<div class="form-group"><label>${req?'<span class="req">*</span>':''}${label}</label><textarea class="form-textarea">${val||''}</textarea>${hint?`<div class="form-hint">${hint}</div>`:''}</div>`;
}
function fRadio(label, opts, val){
  return `<div class="form-group"><label>${label}</label><div class="radio-group">${opts.map(o=>`<label class="radio-item"><input type="radio" name="_r${label.length}${opts[0].length}"${o===val?' checked':''}>${o}</label>`).join('')}</div></div>`;
}
function kv(k, v){ return `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

/* ============ 模拟数据 ============ */
const DS_TYPE_TAG={'SQL Server':'tag-danger','MySQL':'tag-primary','PostgreSQL':'tag-success','Excel':'tag-warning','CSV':'tag-warning','API':'tag-purple','File':'tag-info'};

const STATUS_TXT={pending:'等待中',running:'运行中',success:'成功',failed:'失败',canceled:'已取消'};

const LAYER_TAG={'ODS':'tag-info','DWD':'tag-primary','DWS':'tag-purple','ADS':'tag-success'};

/* ============================================================
   页面：监控大盘
   ============================================================ */
PAGES['dashboard']=function(){

let biDragType=null;
function biDragStart(ev,type){ biDragType=type; ev.dataTransfer.setData('text/plain',type); ev.dataTransfer.effectAllowed='copy'; }
function biDrop(ev){
  ev.preventDefault();
  const type=ev.dataTransfer.getData('text/plain')||biDragType;
  const canvas=document.getElementById('biCanvas');
  canvas.style.outline='none';
  if(!canvas||!type) return;
  const r=canvas.getBoundingClientRect();
  biAddComp(type, ev.clientX-r.left, ev.clientY-r.top);
  toast('已添加组件：'+BI_COMPS[type].t,'success');
}
function biAddComp(type,x,y,title,valContent,isKpi){
  const canvas=document.getElementById('biCanvas');
  if(!canvas)return;
  const c=BI_COMPS[type];
  const div=document.createElement('div');
  div.className='canvas-comp';
  const L=Math.max(4,Math.min(x-c.w/2, canvas.offsetWidth-c.w-4));
  const T=Math.max(4,Math.min(y-(isKpi?c.h/2:24), canvas.offsetHeight-c.h-4));
  div.style.cssText=`left:${L}px;top:${T}px;width:${c.w}px;height:${c.h}px;z-index:${biZ++}`;
  const body=isKpi&&valContent?`<div style="text-align:center"><div style="font-size:26px;font-weight:700;color:var(--text1)">${valContent}</div><div style="font-size:12px;color:var(--text3)">${title||c.t}</div></div>`
    :isKpi?'<div style="text-align:center;font-size:22px;font-weight:700;color:var(--text4)">0.00</div>'
    :(type==='table'||type==='date'||type==='select'||type==='tab')&&title&&title.includes('明细')?miniTable()
    :(type==='date')?`<div style="display:flex;gap:8px;padding:8px"><input class="form-input" value="2026-08-19"><span style="color:var(--text3);align-self:center">至</span><input class="form-input" value="2026-08-25"><button class="btn btn-primary btn-sm">查询</button></div>`
    :`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text4);font-size:12px">${type==='pie'?miniPie():type==='line'||type==='bar'?miniBar(type):type==='table'||type==='tab'?miniTable():'配置数据源后展示'}</div>`;
  div.innerHTML=`<div class="cc-head"><span>${title||c.ic+' '+c.t}</span><span class="cc-del" onclick="biDelComp(this)" title="删除">✕</span></div><div class="cc-body" style="${isKpi?'height:calc(100% - 27px)':''}">${body}</div>`;
  div.addEventListener('mousedown',e=>{ if(e.target.classList.contains('cc-del'))return; biCompDrag(e,div); });
  div.addEventListener('click',e=>{ e.stopPropagation(); biSelectComp(div); });
  canvas.appendChild(div);
  return div;
}
function biCompDrag(e,div){
  e.preventDefault();
  biSelectComp(div);
  const sx=e.clientX, sy=e.clientY;
  const ol=parseInt(div.style.left), ot=parseInt(div.style.top);
  function mm(ev){ div.style.left=(ol+ev.clientX-sx)+'px'; div.style.top=(ot+ev.clientY-sy)+'px'; }
  function mu(){ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); }
  document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
}
function biSelectComp(div){
  document.querySelectorAll('.canvas-comp').forEach(c=>c.classList.remove('sel'));
  div.classList.add('sel');
  const t=document.getElementById('propTitle'); if(t){t.disabled=false;t.value=div.querySelector('.cc-head span').textContent;}
  const i=document.getElementById('propId'); if(i)i.value='comp_'+String(biSeq++).padStart(3,'0');
  ['propX','propY','propW','propH'].forEach(id=>{const el=document.getElementById(id); if(el)el.disabled=false;});
  const set=(id,v)=>{const el=document.getElementById(id); if(el)el.value=v;};
  set('propX',parseInt(div.style.left)); set('propY',parseInt(div.style.top));
  set('propW',parseInt(div.style.width)); set('propH',parseInt(div.style.height));
}
function biClearSel(){
  document.querySelectorAll('.canvas-comp').forEach(c=>c.classList.remove('sel'));
  const t=document.getElementById('propTitle'); if(t){t.disabled=true;t.value='未选中组件';}
  const i=document.getElementById('propId'); if(i)i.value='-';
}
function biDelComp(el){ const c=el.closest('.canvas-comp'); c.remove(); toast('组件已删除','info'); }
function miniBar(type){
  const bars=[60,85,45,95,70,88,55].map((h,i)=>type==='bar'?`<rect x="${i*36+10}" y="${140-h}" width="22" height="${h}" rx="2" fill="${['#409eff','#67c23a','#e6a23c','#f56c6c','#7c3aed','#409eff','#67c23a'][i]}"/>`:`<circle cx="${i*36+21}" cy="${140-h}" r="3.5" fill="#409eff"/>`).join('');
  const line=type==='line'?`<polyline points="${[0,1,2,3,4,5,6].map(i=>`${i*36+21},${140-[60,85,45,95,70,88,55][i]}`).join(' ')}" fill="none" stroke="#409eff" stroke-width="2"/>`:'';
  return `<svg viewBox="0 0 260 150" style="width:95%">${bars}${line}<line x1="5" y1="140" x2="255" y2="140" stroke="#e4e7ed"/></svg>`;
}
