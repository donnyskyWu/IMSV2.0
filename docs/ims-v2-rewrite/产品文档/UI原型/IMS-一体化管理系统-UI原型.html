<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS 一体化管理系统 · UI 原型</title>
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --text2:#86868b;
  --blue:#0071e3; --blue-h:#0077ed; --blue-bg:#e8f2fe;
  --green:#34c759; --orange:#ff9500; --red:#ff3b30; --gray:#8e8e93;
  --cyan:#5ac8fa; --purple:#af52da; --yellow:#ffcc00;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.12);
  --sh:0 1px 3px rgba(0,0,0,.06); --sh-h:0 4px 12px rgba(0,0,0,.10);
  --r:12px; --r-s:8px; --r-xs:5px;
  --spring:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:0}
.masked{color:var(--text2);font-style:italic;letter-spacing:2px}

/* ===================== 布局骨架 ===================== */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto;padding:28px 32px}
.page{max-width:1240px;margin:0 auto}

/* ===================== 侧边栏 ===================== */
.sidebar{width:232px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{padding:20px 18px 12px}
.logo b{font-size:16px;font-weight:700;letter-spacing:-.4px;display:block;line-height:1.15}
.logo small{display:block;font-size:10px;color:var(--text2);font-weight:500;letter-spacing:1.5px;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav-g-h{display:flex;align-items:center;padding:12px 8px 4px;font-size:11px;color:var(--text2);font-weight:600;cursor:pointer;letter-spacing:.6px;user-select:none}
.nav-g-h .caret{margin-left:auto;transition:transform .2s ease;color:var(--text2)}
.nav-g.closed .caret{transform:rotate(-90deg)}
.nav-g.closed .nav-item{display:none}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-s);color:var(--text);cursor:pointer;font-size:13px;transition:background .15s;margin:1px 0}
.nav-item:hover{background:rgba(0,0,0,.045)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:500}
.nav-item .nc{font-size:10px;color:var(--text2);margin-left:auto;letter-spacing:.4px;font-family:ui-monospace,Menlo,monospace}
.nav-item.active .nc{color:var(--blue)}
.uCard{margin:10px;padding:10px 12px;background:var(--card);border-radius:var(--r-s);box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.uCard .av{flex:none}
.uCard .un{font-size:12.5px;font-weight:600;line-height:1.3}
.uCard .ur{font-size:11px;color:var(--text2)}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--blue);flex:none}

/* ===================== 顶栏 ===================== */
.topbar{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:20}
.crumb{font-size:13px;color:var(--text2);white-space:nowrap}
.crumb b{color:var(--text);font-weight:500}
.search{flex:1;max-width:400px;margin:0 auto;position:relative}
.search svg{position:absolute;left:9px;top:8px;color:var(--text2)}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 44px 0 32px;font-size:12.5px;background:rgba(0,0,0,.02);outline:none;font-family:var(--font);transition:all .18s}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.14)}
.kbd{position:absolute;right:8px;top:7px;font-size:10px;color:var(--text2);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:#fff}
.tb-ic{position:relative;cursor:pointer;color:var(--text2);display:flex;padding:7px;border-radius:var(--r-s);transition:background .15s}
.tb-ic:hover{background:var(--bg);color:var(--text)}
.badge{position:absolute;top:1px;right:0;background:var(--red);color:#fff;font-size:9px;font-weight:600;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.rolebtn{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line2);border-radius:var(--r-s);cursor:pointer;font-size:12.5px;background:#fff;transition:all .15s;white-space:nowrap}
.rolebtn:hover{border-color:rgba(0,113,227,.4);color:var(--blue)}
.rolebtn .av{width:22px;height:22px;font-size:11px}
.rolebtn svg{color:var(--text2)}
.rolemenu{position:fixed;top:54px;right:20px;width:264px;background:#fff;border-radius:var(--r);box-shadow:0 10px 36px rgba(0,0,0,.18);padding:6px;z-index:150;display:none;border:1px solid var(--line)}
.rolemenu.on{display:block;animation:pop .18s ease}
.rm-h{font-size:11px;color:var(--text2);padding:7px 10px 4px;font-weight:600;letter-spacing:.5px}
.rm-i{display:flex;gap:9px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;align-items:center}
.rm-i:hover{background:var(--bg)}
.rm-i.on{background:var(--blue-bg);color:var(--blue)}
.rm-i .rn{font-size:12.5px;font-weight:500;line-height:1.3}
.rm-i .rr{font-size:11px;color:var(--text2)}
.rm-i.on .rr{color:var(--blue)}
.rm-i .rc{font-size:10px;color:var(--text2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px;margin-left:auto;font-family:ui-monospace,Menlo,monospace}

/* ===================== 按钮 / 标签 / 表格 ===================== */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:var(--r-s);font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:var(--font);transition:all .18s ease;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-h);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,113,227,.28)}
.btn-sec{background:#fff;border-color:var(--line2);color:var(--text)}
.btn-sec:hover{background:var(--bg);transform:translateY(-1px)}
.btn-sm{height:26px;padding:0 11px;font-size:12px;border-radius:var(--r-xs)}
.btn-txt{background:none;color:var(--blue);padding:0 6px;height:auto}
.btn-txt:hover{background:var(--blue-bg);border-radius:var(--r-xs)}
.btn-pill{border-radius:980px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-xs);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.3px;border-bottom:1px solid var(--line);background:#fafafc;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:#f5f5f7}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red);font-weight:600}
.pos{color:#1e8e3e;font-weight:600}

/* ===================== 查询栏 ===================== */
.qbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto}
.qbar input,.qbar select{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;font-size:12.5px;background:#fff;color:var(--text);font-family:var(--font);outline:none;flex:none;transition:border-color .15s}
.qbar input:focus,.qbar select:focus{border-color:var(--blue)}
.qbar .sp{flex:1}
.qbar label{font-size:12px;color:var(--text2);flex:none}

/* ===================== 页头 / 卡片 / 网格 ===================== */
.pg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pg-h h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.07}
.pg-h .sub{font-size:13px;color:var(--text2);margin-top:5px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;transition:box-shadow .2s,transform .2s}
.card.hov{cursor:pointer}
.card.hov:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px}
.card .csub{font-size:12px;color:var(--text2)}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.g2r{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{display:flex;flex-direction:column}
.stat .l{font-size:12px;color:var(--text2)}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;font-weight:500;color:var(--text2);letter-spacing:0}
.stat .d{font-size:11.5px;margin-top:8px;color:var(--text2)}
.sec{font-size:16px;font-weight:600;letter-spacing:-.2px;margin:20px 0 12px}
.hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd-row h3{font-size:17px;font-weight:600;letter-spacing:-.2px}

/* ===================== Tab ===================== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue);border-color:var(--blue);font-weight:500}
/* 分类 Tab（带计数徽标） */
.cattabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cattab{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;font-size:12.5px;color:var(--text2);cursor:pointer;border:1px solid var(--line2);border-radius:18px;background:#fff;transition:all .15s;user-select:none}
.cattab:hover{border-color:rgba(0,113,227,.4);color:var(--blue)}
.cattab.on{color:var(--blue);border-color:var(--blue);background:var(--blue-bg);font-weight:500}
.cbadge{font-size:10.5px;color:var(--text2);background:rgba(0,0,0,.05);border-radius:8px;padding:0 6px;line-height:16px;font-family:ui-monospace,Menlo,monospace}
.cattab.on .cbadge{color:var(--blue);background:rgba(0,113,227,.12)}
/* ===================== 考试/问卷题目组件 ===================== */
.qz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qz-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qz-item{padding:14px 0;border-bottom:1px solid var(--line)}
.qz-item:last-child{border-bottom:none}
.qz-q{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:10px}
.qz-q .qno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;background:rgba(0,113,227,.1);color:var(--blue);font-size:11.5px;font-weight:700;margin-right:8px;font-family:ui-monospace,Menlo,monospace}
.qz-q .qscore{font-size:11.5px;color:var(--text2);font-weight:500;margin-left:6px}
.qz-opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r-s);margin-bottom:7px;cursor:pointer;transition:all .15s;font-size:13px;line-height:1.5}
.qz-opt:hover{border-color:rgba(0,113,227,.4);background:rgba(0,113,227,.04)}
.qz-opt.on{border-color:var(--blue);background:rgba(0,113,227,.08);color:var(--blue);font-weight:500}
.qz-opt .ol{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text2);margin-top:1px}
.qz-opt.on .ol{border-color:var(--blue);background:var(--blue);color:#fff}
.qz-opt.right{border-color:var(--green);background:rgba(52,199,89,.08)}
.qz-opt.right .ol{border-color:var(--green);background:var(--green);color:#fff}
.qz-opt.wrong{border-color:var(--red);background:rgba(255,59,48,.07)}
.qz-opt.wrong .ol{border-color:var(--red);background:var(--red);color:#fff}
.qz-ana{font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px;padding:8px 10px;background:rgba(0,0,0,.03);border-radius:var(--r-s)}
.qz-timer{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--orange);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.qz-result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 10px 18px}
.qz-result .rscore{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;margin:10px 0 4px}
.qz-result .rsub{font-size:12.5px;color:var(--text2);line-height:1.6}
.qz-gradeitem{padding:11px 0;border-bottom:1px solid var(--line)}
.qz-gradeitem:last-child{border-bottom:none}

/* ===================== 抽屉 / 遮罩 / 消息 ===================== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:100;display:flex;flex-direction:column;transform:translateX(103%);transition:transform .3s var(--spring);box-shadow:-10px 0 40px rgba(0,0,0,.14);width:720px}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.drawer-h b{font-size:16px;font-weight:600;letter-spacing:-.3px}
.dr-x{cursor:pointer;color:var(--text2);padding:6px;border-radius:var(--r-s);display:flex;transition:all .15s}
.dr-x:hover{background:var(--bg);color:var(--text)}
.drawer-b{flex:1;overflow-y:auto;padding:20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none;background:#fff}
.msgdrawer{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:100;display:flex;flex-direction:column;transform:translateX(103%);transition:transform .3s var(--spring);box-shadow:-10px 0 40px rgba(0,0,0,.14);width:420px}
.msgdrawer.on{transform:none}
.mg-list{flex:1;overflow-y:auto}
.mg-i{display:flex;gap:10px;padding:13px 18px;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;transition:background .12s;align-items:flex-start}
.mg-i:hover{background:var(--bg)}
.mg-i .mt{font-size:13px;font-weight:500;line-height:1.4}
.mg-i .mc{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4}
.mg-i .md{font-size:11px;color:var(--text2);margin-top:4px}
.mg-ud{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.mg-i.read .mg-ud{background:transparent}

/* ===================== Toast / 空状态 / 杂项 ===================== */
.toasts{position:fixed;top:16px;right:16px;z-index:220;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:11px 15px;font-size:13px;font-weight:500;animation:tin .28s var(--spring);min-width:220px}
.toast.t-success{color:#1e8e3e}
.toast.t-warn{color:#c46a00}
.toast.t-error{color:#d70015}
.toast.out{opacity:0;transform:translateX(18px);transition:all .3s}
@keyframes tin{from{transform:translateX(24px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}}
.empty{padding:44px 20px;text-align:center;color:var(--text2)}
.empty svg{margin-bottom:10px;opacity:.5}
.empty .et{font-size:13px;font-weight:500;color:var(--text2)}
.empty .es{font-size:12px;margin-top:3px}
.pg{height:6px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden;min-width:56px;display:inline-block;vertical-align:middle}
.pg i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.sw{width:38px;height:23px;border-radius:12px;background:#d9d9de;display:inline-flex;align-items:center;padding:2px;cursor:pointer;transition:background .2s;flex:none}
.sw i{width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on i{transform:translateX(15px)}
.tl{position:relative;margin:4px 0 0 8px}
.tl::before{content:'';position:absolute;left:4px;top:8px;bottom:12px;width:2px;background:rgba(0,0,0,.08)}
.tl-i{position:relative;padding:0 0 18px 20px}
.tl-i::before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.tl-i.gg::before{background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.tl-i.oo::before{background:var(--orange);box-shadow:0 0 0 3px rgba(255,149,0,.18)}
.tl-i .tt{font-size:13px;font-weight:500}
.tl-i .td{font-size:11.5px;color:var(--text2);margin-top:1px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin:4px 0}
.kv>div{min-width:0}
.kv .k{font-size:11.5px;color:var(--text2);margin-bottom:2px}
.kv .v{font-size:13px;font-weight:500}
.dsec{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.5px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.dsec:first-child{margin-top:0;padding-top:0;border-top:none}
.hint{font-size:11.5px;color:var(--text2);margin-top:6px}
.rowline{display:flex;align-items:center;gap:10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:4px}
.bars .b{flex:1;border-radius:4px 4px 0 0;background:var(--blue);opacity:.9;min-width:8px;transition:opacity .15s}
.bars .b:hover{opacity:1;background:var(--blue-h)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-xs);font-size:11.5px;background:rgba(0,113,227,.1);color:var(--blue);font-weight:500;margin-right:6px}
.chip.pp{background:rgba(175,82,218,.1);color:#8944ab}
.photo{height:170px;border-radius:10px;background:linear-gradient(135deg,#e9f2fc,#d6e7f8);display:flex;align-items:center;justify-content:center;color:#a6bdd6;margin-bottom:14px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.formrow.one{grid-template-columns:1fr}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;height:34px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 10px;font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s;background:#fff}
.fld textarea{height:auto;padding:8px 10px;resize:vertical;min-height:70px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.lv{font-size:12px;padding:1px 7px;border-radius:4px;font-weight:600}

/* ===================== 交互增强：确认弹窗 / 表单 / 下载条 ===================== */
.cfwrap{position:fixed;inset:0;z-index:180;display:none}
.cfwrap.on{display:block}
.cfmask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.cfcard{position:absolute;top:50%;left:50%;transform:translate(-50%,-48%) scale(.96);opacity:0;width:420px;max-width:calc(100vw - 48px);background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.22);padding:20px 22px 16px;animation:cfIn .26s var(--spring) forwards;border:1px solid var(--line)}
@keyframes cfIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cf-t{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.2px}
.cf-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--blue-bg);color:var(--blue);flex:none}
.cfcard.danger .cf-ic{background:rgba(255,59,48,.12);color:var(--red)}
.cf-warn{display:flex;align-items:center;gap:7px;margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(255,59,48,.08);color:#d70015;font-size:12.5px;font-weight:500;line-height:1.5}
.cf-m{margin-top:12px;font-size:13px;color:var(--text2);line-height:1.6}
.cf-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#ff453a;transform:translateY(-1px);box-shadow:0 4px 10px rgba(255,59,48,.3)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.btn-sec .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
.dlbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.18);padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:230;animation:tin .3s var(--spring);font-size:13px;border:1px solid var(--line)}
.dlbar.fadeout{opacity:0;transform:translateX(-50%) translateY(10px);transition:all .4s}
.dlbar .dl-t{display:flex;flex-direction:column;line-height:1.35}
.dlbar .dl-t b{font-size:13px}
.dlbar .dl-t small{font-size:11px;color:var(--text2)}
.dlbar svg{color:var(--blue)}
.dl-act{color:var(--blue);cursor:pointer;font-weight:600;font-size:12.5px;padding:4px 8px;border-radius:5px}
.dl-act:hover{background:var(--blue-bg)}
.dl-x{cursor:pointer;color:var(--text2);display:flex;padding:4px;border-radius:4px;transition:all .15s}
.dl-x:hover{background:var(--bg);color:var(--text)}
.fld.wide{grid-column:1 / -1}
.fld .ferr{font-size:12px;color:var(--red);margin-top:4px;min-height:0;line-height:1.3}
.fld input.err,.fld select.err,.fld textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.12)}
.fld{position:relative}
.fld .unit{position:absolute;right:10px;bottom:9px;font-size:12px;color:var(--text2);pointer-events:none}
.fld .req{color:var(--red);font-style:normal;margin-left:2px}
.fup{display:flex;align-items:center;justify-content:center;gap:7px;height:64px;border:1.5px dashed var(--line2);border-radius:8px;color:var(--text2);font-size:12.5px;cursor:pointer;transition:all .15s;background:rgba(0,0,0,.015)}
.fup:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill input{display:none}
.pill span{display:inline-flex;align-items:center;height:30px;padding:0 14px;border:1px solid var(--line2);border-radius:980px;font-size:12.5px;cursor:pointer;transition:all .15s;background:#fff;color:var(--text2);user-select:none}
.pill:hover span{border-color:rgba(0,113,227,.4);color:var(--blue)}
.pill.on span{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.okwrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 10px 22px}
.okwrap b{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:14px}
.okno{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.okno small{font-size:11px;color:var(--text2);letter-spacing:1px}
.okno .mono{font-size:15px;color:var(--blue);font-weight:600}
.okex{margin-top:10px;font-size:12.5px;color:var(--text2);line-height:1.6}
.rowflash td{animation:rowfl 2s ease}
@keyframes rowfl{0%{background:rgba(0,113,227,.18)}100%{background:transparent}}
tr.rowflash:hover td{animation:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="mask" id="mask" onclick="closeAll()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h"><b id="dr-title"></b><span class="dr-x" onclick="closeDrawer()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
  <div class="drawer-b" id="dr-body"></div>
  <div class="drawer-f" id="dr-foot"></div>
</aside>
<aside class="msgdrawer" id="msgdrawer">
  <div class="drawer-h"><b>消息中心</b><span class="dr-x" onclick="closeMsg()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div>
  <div class="mg-list" id="mglist"></div>
  <div class="drawer-f"><button class="btn btn-sec" style="width:100%" onclick="markAllRead()">全部已读</button></div>
</aside>
<div class="rolemenu" id="rolemenu"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* ===================== 基础工具 ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const state = { role: 'R1', page: 'workbench', tab: {}, gc: {}, qz: null, msgOpen: false, q: {} };

function fmtMoney(n) { return '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function maskPhone(p) { return p.slice(0, 3) + '****' + p.slice(-4); }
function maskID(id) { return id.slice(0, 3) + '*'.repeat(Math.max(id.length - 7, 8)) + id.slice(-4); }
/* R9 数据分析师视角：敏感字段脱敏 */
function sens(v) { return state.role === 'R9' ? '<span class="masked">••••</span>' : v; }
function pgbar(pct, color) { return '<span class="pg" style="width:70px"><i style="width:' + Math.min(pct, 100) + '%;background:' + (color || 'var(--blue)') + '"></i></span>'; }

const TAGMAP = {
  green: ['52,199,89', '#1e8e3e'], blue: ['0,113,227', '#0071e3'], red: ['255,59,48', '#d70015'],
  orange: ['255,149,0', '#c46a00'], gray: ['142,142,147', '#6d6d72'], cyan: ['90,200,250', '#0e7fb8'],
  purple: ['175,82,218', '#8944ab'], yellow: ['255,204,0', '#a07d00']
};
function tag(t, c) {
  const m = TAGMAP[c] || TAGMAP.gray;
  return '<span class="tag" style="background:rgba(' + m[0] + ',.12);color:' + m[1] + '"><span class="dot"></span>' + t + '</span>';
}

/* ===================== 内联 SVG 图标 ===================== */
const IC = {
  star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z',
  shield: 'M12 3l7 3v6c0 4.4-2.9 7.6-7 9-4.1-1.4-7-4.6-7-9V6z',
  box: 'M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20c1.2-3.2 3.7-5 7-5s5.8 1.8 7 5',
  id: 'M3 6h18v12H3zM7 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM11 12h6M11 15h4',
  video: 'M15 10l6-3.5v11L15 14zM3 7h12v10H3z',
  film: 'M4 4h16v16H4zM4 9h16M4 15h16M9 4v16M15 4v16',
  book: 'M6 3h9a3 3 0 0 1 3 3v15H9a3 3 0 0 1-3-3zM18 6v12',
  cal: 'M5 5h14v16H5zM5 9h14M9 3v4M15 3v4',
  doc: 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6',
  flow: 'M7 4h10v4H7zM7 16h10v4H7zM12 8v4M12 12l-3 3M12 12l3 3',
  yuan: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM8.5 7l3.5 5 3.5-5M9 12.5h6M9 15.5h6',
  chart: 'M5 20V10M12 20V4M19 20v-7',
  bell: 'M18 15V10a6 6 0 1 0-12 0v5l-2 3h16zM10 21h4',
  target: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z',
  db: 'M12 3c4.4 0 8 1.3 8 3s-3.6 3-8 3-8-1.3-8-3 3.6-3 8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
  people: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c1-3 3.5-4.5 6.5-4.5s5.5 1.5 6.5 4.5M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 15.8c1.5.7 2.5 2 3 4.2',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM16.5 16.5L21 21',
  help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9a2.5 2. 5 0 1 1 4 2c-1 .8-2 1.2-2 2.5M12 17h.01',
  chev: 'M6 9l6 6 6-6',
  right: 'M9 6l6 6-6 6',
  x: 'M6 6l12 12M18 6L6 18',
  clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
  check: 'M5 12l5 5 9-11',
  plus: 'M12 5v14M5 12h14',
  arrow: 'M5 12h14M13 6l6 6-6 6',
  warn: 'M12 3l9 17H3zM12 10v4M12 17h.01',
  spark: 'M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z'
};
function ic(n, s) {
  s = s || 16;
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="' + (IC[n] || IC.doc) + '"/></svg>';
}
function av(name, bg) { return '<span class="av" style="background:' + (bg || 'var(--blue)') + '">' + name.slice(0, 1) + '</span>'; }

/* ===================== 角色体系 ===================== */
const ROLES = {
  R1: { name: '系统管理员', user: 'Donny', modules: '*' },
  R2: { name: '行政管理员', user: '林岚', modules: ['workbench', 'cert', 'asset', 'acct', 'train', 'meet', 'report'] },
  R3: { name: '财务管理员', user: '周晴', modules: ['workbench', 'fin', 'asset', 'acct', 'alert'] },
  R4: { name: '运营总监', user: '何舟', modules: ['workbench', 'live', 'content', 'perf', 'report', 'comp', 'dc', 'bi', 'eff', 'alert'] },
  R5: { name: '直播运营', user: '赵敏', modules: ['workbench', 'live', 'content', 'report'] },
  R6: { name: '短视频运营', user: '孙倩', modules: ['workbench', 'content', 'report'] },
  R7: { name: '主播/达人', user: '苏杳', modules: ['workbench', 'live', 'cert'] },
  R8: { name: '内容审核员', user: '李澈', modules: ['workbench', 'content'] },
  R9: { name: '数据分析师', user: '陈默', modules: ['workbench', 'dc', 'bi', 'comp', 'eff', 'cert', 'acct'] },
  R10: { name: '外协人员', user: '王野', modules: ['workbench'] },
  R11: { name: 'AI 资产管理员', user: '唐宁', modules: ['workbench', 'airSkill', 'airExpert', 'airKb', 'airKey', 'airLog'] }
};

/* ===================== 模块定义 ===================== */
const MODS = {
  workbench: { no: '', name: '工作台', code: 'HOME', icon: 'star', page: '工作台首页', desc: '一站式待办中心与快捷入口' },
  auth: { no: '01', name: '权限管理', code: 'AUTH', icon: 'shield', page: '权限管理首页', desc: '统一账号体系与钉钉组织架构同步' },
  asset: { no: '07', name: '资产管理', code: 'ASSET', icon: 'box', page: '资产台账', desc: '设备资产全生命周期登记与流转' },
  acct: { no: '08', name: '账号管理', code: 'ACCT', icon: 'user', page: '账号台账', desc: '直播/短视频账号池统一管理与领用' },
  cert: { no: '06', name: '证件档案', code: 'CERT', icon: 'id', page: '证件档案', desc: '员工证件数字化存档与水印分级查看' },
  live: { no: '10', name: '直播管理', code: 'LIVE', icon: 'video', page: '直播管理', desc: '开播风控登记与场次全量台账' },
  content: { no: '15', name: '内容生产', code: 'CONTENT', icon: 'film', page: 'SOP 模板管理', desc: '内容生产 SOP 编排与节点提示词' },
  train: { no: '02', name: '培训', code: 'TRAIN', icon: 'book', page: '培训管理', desc: '培训计划、报名与签到管理' },
  meet: { no: '03', name: '会议', code: 'MEET', icon: 'cal', page: '会议管理', desc: '会议室预约与会议纪要跟踪' },
  report: { no: '09', name: '数据上报', code: 'REPORT', icon: 'doc', page: '日报中心', desc: '直播/短视频/运营/行政日报统一中心' },
  flow: { no: '14', name: '工作流', code: 'FLOW', icon: 'flow', page: '流程管理', desc: '审批流程发起、流转与催办' },
  fin: { no: '11', name: '财务核算', code: 'FIN', icon: 'yuan', page: '成本核算', desc: '直播场次收入成本与主播分成结算' },
  perf: { no: '05', name: '绩效', code: 'PERF', icon: 'chart', page: '绩效考核', desc: 'KPI 考核方案、在线考试与考核结果' },
  alert: { no: '13', name: '预警', code: 'ALERT', icon: 'bell', page: '预警中心', desc: '预警规则配置与实时预警处理' },
  comp: { no: '04', name: '竞品', code: 'COMP', icon: 'target', page: '竞品库', desc: '竞品账号数据追踪与对比分析' },
  dc: { no: '12', name: '数据中心', code: 'DC', icon: 'db', page: '数据总览', desc: '账号-资产-实名人-场次-成本-利润全链穿透' },
  bi: { no: '17', name: '数据分析', code: 'BI', icon: 'chart', page: '报表中心', desc: '运营看板与经营分析报表' },
  eff: { no: '19', name: '组织人效', code: 'EFF', icon: 'people', page: '人效看板', desc: '人员主兼职归属分摊与人效分析' },
  airSkill: { no: '20', name: '技能库', code: 'AIR', icon: 'spark', page: '技能库', desc: 'AI 技能登记、审核、版本与授权分发' },
  airExpert: { no: '20', name: '专家库', code: 'AIR', icon: 'star', page: '专家库', desc: '专家包组装（Prompt+技能+知识）与授权' },
  airKb: { no: '20', name: '知识库', code: 'AIR', icon: 'book', page: '知识库', desc: '知识入库审批、密级管理与 RAGFlow 底座' },
  airKey: { no: '20', name: 'Key 管理', code: 'AIR', icon: 'shield', page: 'Key 管理', desc: '人员 API Key 生成、生命周期与白名单' },
  airLog: { no: '20', name: '审计监控', code: 'AIR', icon: 'chart', page: '审计监控', desc: 'MCP 调用审计、用量统计与 RAGFlow 健康' }
};
/* 业务域分组（用户视角）：组标题 + 模块 id 列表；可见性按角色白名单过滤 */
const GROUPS = [
  ['工作台', ['workbench']],
  ['组织与人员', ['auth', 'cert', 'train', 'perf', 'eff']],
  ['资源管理', ['asset', 'acct']],
  ['直播与内容', ['live', 'content', 'comp']],
  ['协同办公', ['meet', 'report', 'flow']],
  ['财务', ['fin']],
  ['数据与分析', ['dc', 'bi', 'alert']],
  ['AI 资源中台', ['airSkill', 'airExpert', 'airKb', 'airKey', 'airLog']]
];
const PAGES = {}; /* 各模块渲染函数注册表 */

/* AIR 菜单拆分兼容：'air' 统一重定向到 'airSkill'（技能库） */
const AIR_IDS = ['airSkill', 'airExpert', 'airKb', 'airKey', 'airLog'];
function airNorm(id) { return id === 'air' ? 'airSkill' : id; }
function canAccess(id) { const r = ROLES[state.role]; if (id === 'air') id = 'airSkill'; return r.modules === '*' || r.modules.indexOf(id) >= 0; }
function go(id) {
  id = airNorm(id);
  if (!canAccess(id)) { toast('当前角色（' + ROLES[state.role].name + '）无权限访问该模块', 'warn'); return; }
  state.page = id;
  renderAll();
  $('#content').scrollTop = 0;
}
function setTab(pid, t) { state.tab[pid] = t; renderPage(); }
function tgGroup(g) { state.gc[g] = !state.gc[g]; renderSidebar(); }

/* ===================== 渲染骨架 ===================== */
function renderSidebar() {
  let h = '<div class="logo"><b>IMS 一体化管理系统</b><small>神鱼体育 · SHENYU SPORTS</small></div><nav class="nav">';
  GROUPS.forEach(function (g) {
    const gid = g[0], closed = state.gc[gid];
    /* 角色无权访问组内全部模块时，整组（含标题）隐藏 */
    const visible = g[1].filter(function (mid) { return canAccess(mid); });
    if (!visible.length) return;
    h += '<div class="nav-g' + (closed ? ' closed' : '') + '"><div class="nav-g-h" onclick="tgGroup(\'' + gid + '\')">' + gid +
      '<span class="caret">' + ic('chev', 12) + '</span></div>';
    visible.forEach(function (mid) {
      const m = MODS[mid];
      h += '<div class="nav-item' + (state.page === mid ? ' active' : '') + '" onclick="go(\'' + mid + '\')">' + ic(m.icon, 16) +
        '<span>' + m.name + '</span><span class="nc">' + (m.code ? m.no + ' ' + m.code : '') + '</span></div>';
    });
    h += '</div>';
  });
  h += '</nav>';
  const r = ROLES[state.role];
  h += '<div class="uCard">' + av(r.user, '#0071e3') + '<div><div class="un">' + r.user + '</div><div class="ur">' + state.role + ' · ' + r.name + '</div></div></div>';
  $('#sidebar').innerHTML = h;
}
function renderTopbar() {
  const m = MODS[state.page], r = ROLES[state.role], unread = MSGS.filter(function (x) { return !x.read; }).length;
  $('#topbar').innerHTML =
    '<div class="crumb"><b>' + m.name + '</b> / ' + m.page + '</div>' +
    '<div class="search">' + ic('search', 14) + '<input id="gsearch" placeholder="搜索模块、单据、账号…" onkeydown="if(event.key===\'Enter\'){toast(\'搜索「\'+this.value+\'」· 原型示意\',\'success\')}"><span class="kbd">⌘K</span></div>' +
    '<div class="tb-ic" onclick="openMsg()" title="消息中心">' + ic('bell', 19) + (unread ? '<span class="badge">' + unread + '</span>' : '') + '</div>' +
    '<div class="tb-ic" onclick="toast(\'帮助中心 · 原型示意\',\'success\')" title="帮助">' + ic('help', 19) + '</div>' +
    '<div class="rolebtn" onclick="toggleRoleMenu(event)">' + av(r.user, '#34c759') + '<span>' + state.role + ' ' + r.name + '</span>' + ic('chev', 13) + '</div>';
}
function renderPage() {
  const fn = PAGES[state.page] || PAGES.workbench;
  $('#content').innerHTML = '<div class="page">' + fn() + '</div>';
}
function renderAll() { renderSidebar(); renderTopbar(); renderPage(); }

/* ===================== 角色切换 ===================== */
function toggleRoleMenu(e) { e.stopPropagation(); $('#rolemenu').classList.toggle('on'); }
function renderRoleMenu() {
  let h = '<div class="rm-h">切换角色（实时生效）</div>';
  Object.keys(ROLES).forEach(function (k) {
    const r = ROLES[k];
    h += '<div class="rm-i' + (state.role === k ? ' on' : '') + '" onclick="setRole(\'' + k + '\')">' + av(r.user, state.role === k ? '#0071e3' : '#8e8e93') +
      '<div><div class="rn">' + r.user + '</div><div class="rr">' + r.name + '</div></div><span class="rc">' + k + '</span></div>';
  });
  $('#rolemenu').innerHTML = h;
}
function setRole(k) {
  state.role = k;
  $('#rolemenu').classList.remove('on');
  if (!canAccess(state.page)) { state.page = 'workbench'; toast('已切换为 ' + k + ' ' + ROLES[k].name + '，跳转至工作台', 'success'); }
  else { toast('已切换角色：' + k + ' ' + ROLES[k].name, 'success'); }
  renderRoleMenu(); renderAll();
}

}
/* 表格通用过滤：norm(row, index)->文本数组；status(row, index)->状态字符串 */
function qFilter(src, norm, status) {
  const g = qGrab();
  if (g.init) return src;
  const list = src.filter(function (r, i) {
    let ok = true;
    g.vals.forEach(function (v, j) {
      if (!ok || !v) return;
      if (/^全部|^同步状态|^档案状态|^到期状态|^分摊状态$|^穿透/.test(v)) return;
      const n = norm(r, i, j), s = status(r, i, j);
      /* 状态字段（含复合串 '抖音|冻结'）做包含匹配：下拉选值命中任一状态分量即通过 */

        const parts = String(s).split('|');
        if (parts.indexOf(v) >= 0 || v === s) return;

      }
      const t = (n || []).join(' ').toLowerCase();
      if (t.indexOf(String(v).toLowerCase()) < 0) ok = false;
    });
    return ok;
  });

}

    else if (f.type === 'textarea') inner = '<textarea id="' + pid + '" placeholder="' + (f.ph || '') + '">' + (f.val || '') + '</textarea>';
    else if (f.type === 'pills') inner = '<div class="pills">' + f.opts.map(function (o, i) { return '<label class="pill' + (o === f.val ? ' on' : '') + '"><input type="radio" name="P_' + f.k + '" value="' + o + '"' + (o === f.val ? ' checked' : '') + ' onchange="pillSel(this)"><span>' + o + '</span></label>'; }).join('') + '</div>';
    else if (f.type === 'file') inner = '<label class="fup" id="' + pid + '" onclick="toast(\'附件上传（原型占位）\',\'success\')">' + ic('plus', 15) + '<span>' + (f.ph || '点击上传照片 / 附件') + '</span></label>';
    else if (f.type === 'pre') inner = '<input id="' + pid + '" value="' + (f.val || '') + '" oninput="' + f.pre + '" placeholder="' + (f.ph || '') + '"' + (f.disabled ? ' readonly' : '') + '>';
    else inner = '<input id="' + pid + '" type="' + (f.type === 'date' ? 'date' : f.type === 'dt' ? 'datetime-local' : f.type === 'num' ? 'number' : 'text') + '" value="' + (f.val != null ? f.val : '') + '" placeholder="' + (f.ph || '') + '" style="' + (f.unit ? 'padding-right:32px' : '') + '"' + (f.disabled ? ' readonly' : '') + '>' + (f.unit ? '<span class="unit">' + f.unit + '</span>' : '');
    return '<div class="fld' + (f.wide ? ' wide' : '') + '"><label>' + f.label + (f.req ? '<i class="req">*</i>' : '') + '</label>' + inner + '<div class="ferr" id="E_' + f.k + '"></div>' + (f.hint ? '<div class="hint">' + f.hint + '</div>' : '') + '</div>';
  }).join('');
}

function formValidate(keys) {

/* 冲话费账实核对实时计算 */
function acctChargeCalc() {
  const amt = Number($('#F_camt').value || 0), real = Number($('#F_creal').value || 0);
  if ($('#ccA')) $('#ccA').textContent = amt ? fmtMoney(amt) : '—';
  if ($('#ccR')) $('#ccR').textContent = real ? fmtMoney(real) : '—';
  const d = $('#ccD');
  if (d) {
    if (!amt || !real) { d.textContent = '待输入'; d.style.color = ''; }
    else if (amt === real) { d.textContent = '✓ 账实一致'; d.style.color = 'var(--green)'; }
    else { d.textContent = '⚠ 差异 ' + fmtMoney(Math.abs(amt - real)) + '，需说明原因'; d.style.color = 'var(--red)'; }
  }
}

function acctChargeSubmit(i) {

/* 下播录入实时测算 */
function liveEntryCalc() {
  const g = Number($('#F_lgmv').value || 0), o = Number($('#F_lord').value || 0), v = Number($('#F_lview').value || 0), p = Number($('#F_lpeak').value || 0);
  if ($('#leA')) $('#leA').textContent = o > 0 ? '¥' + (g / o).toFixed(1) : '—';
  if ($('#leG')) $('#leG').textContent = v > 0 ? '¥' + (g / v * 1000).toFixed(1) : '—';
  if ($('#leP')) $('#leP').textContent = v > 0 ? ((p / v) * 100).toFixed(1) + '%' : '—';
}
/* LIVE-002：提交闭环（写入 LIVES 数据 + 状态刷新） */
function liveEndEntrySubmit(id) {
  const l = LIVES.filter(function (x) { return x.id === id; })[0];
  if (!l) return;
  if (!formValidate(['lgmv', 'lview', 'lreal'])) return;
  liveEntryCalc();
  const gmv = Number($('#F_lgmv').value || 0), ord = Number($('#F_lord').value || 0);
  const views = Number($('#F_lview').value || 0), peak = Number($('#F_lpeak').value || 0);
  confirmDlg('确认提交下播数据？', '场次 ' + l.id + '（' + l.topic + '）GMV ' + fmtMoney(gmv) + ' · 观看 ' + views.toLocaleString() + ' 人，提交后将写入台账留痕（BR-006）并同步财务核算。', '提交录入', function () {
    l.gmv = gmv; l.orders = ord; l.views = views; l.peak = peak;
    l.fans = Number($('#F_lfans').value || 0);
    l.entered = true;
    if (state.page === 'live') renderPage();
    closeDrawer();
    toast('下播数据已录入：' + l.id + ' · GMV ' + fmtMoney(gmv) + '（已同步财务/数据模块）', 'success');
    hlFirst();
  });
}

/* 纪要详情抽屉：已生成→内容+决议待办+归档；AI 转写中→进度；待生成→触发 AI 生成 */
function meetDetail(id) {
  const m = MEETS.filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  let body = '<div class="kv">' +
    '<div><div class="k">会议编号</div><div class="v mono">' + m.id + '</div></div>' +
    '<div><div class="k">主题</div><div class="v">' + m.topic + '</div></div>' +
    '<div><div class="k">组织者</div><div class="v">' + sens(m.org) + '</div></div>' +
    '<div><div class="k">时间 / 时长</div><div class="v">' + m.time + ' · ' + m.dur + '</div></div>' +
    '<div><div class="k">会议室</div><div class="v">' + m.room + '</div></div>' +
    '<div><div class="k">参会人数</div><div class="v">' + m.ppl + ' 人</div></div></div>';
  if (m.min === '已生成' || m.min === '已归档') {
    /* 纪要正文 + 决议待办 */
    body += '<div class="dsec">纪要正文' + (m.min === '已归档' ? '（已归档 · 只读）' : '') + '</div>' +
      '<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--text)">' + (m.minBody || '（纪要内容待补充）') + '</div>';
    const decs = m.decisions || [];
    body += '<div class="dsec">决议事项 → 待办（' + decs.length + ' 项）</div>';
    if (decs.length) {
      body += '<div class="tl">' + decs.map(function (d) {
        return '<div class="tl-i gg"><div class="tt" style="font-size:12.5px">' + d.d + '</div><div class="td">截止 ' + d.due + ' · 已转待办（钉钉待办 + 工作台待办中心）</div></div>';
      }).join('') + '</div>';
    } else {
      body += '<div class="hint">本次会议无决议事项</div>';
    }
    const foot = '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>' +
      (m.min === '已生成' ? '<button class="btn btn-sec" onclick="meetMinEdit(\'' + m.id + '\')">编辑纪要</button>' +
        '<button class="btn btn-pri" onclick="meetMinArchive(\'' + m.id + '\')">归档纪要</button>' : '');
    openDrawer('会议纪要 · ' + m.topic, body, foot, '560px');
  } else if (m.min === 'AI 转写中') {
    /* AI 转写进度 */
    body += '<div class="dsec">AI 纪要生成中</div>' +
      '<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:16px;text-align:center">' +
      '<span class="spin" style="display:inline-block;margin-bottom:8px"></span>' +
      '<div style="font-size:13px;font-weight:600">AI 听记转写中 · 约 3 分钟完成</div>' +
      '<div class="hint" style="margin-top:4px">转写完成后将自动提取决议事项并生成待办推送（MEET-004）</div>' +
      '<div class="rowline" style="justify-content:center;gap:8px;margin-top:10px">' +
      '<span class="btn btn-sec btn-sm" onclick="meetMinDone(\'' + m.id + '\')">模拟转写完成</span></div></div>';
    openDrawer('会议纪要 · ' + m.topic, body, '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>', '480px');
  } else {
    /* 待生成：触发 AI 生成 */
    body += '<div class="dsec">纪要状态</div>' +
      '<div class="card" style="box-shadow:none;border:1px dashed var(--line2);padding:16px;text-align:center">' +
      '<div style="font-size:13px;font-weight:600;color:var(--orange)">纪要尚未生成</div>' +
      '<div class="hint" style="margin-top:4px">可等待会议结束后 AI 自动生成，或上传录音/手动录入触发即时生成</div>' +
      '<div class="rowline" style="justify-content:center;gap:8px;margin-top:10px">' +
      '<span class="btn btn-pri btn-sm" onclick="meetMinGen(\'' + m.id + '\')">' + ic('bolt', 13) + ' 触发 AI 生成</span>' +
      '<span class="btn btn-sec btn-sm" onclick="meetMinManual(\'' + m.id + '\')">手动录入纪要</span></div></div>';
    openDrawer('会议纪要 · ' + m.topic, body, '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>', '480px');
  }

  const body = frow([
    { k: 'minbody', label: '纪要正文', type: 'textarea', req: true, val: m.minBody || '', wide: true }

  openDrawer('编辑纪要 · ' + m.topic, body,

function meetMinEditOk(id) {

function barsChart(vals) {
  const max = Math.max.apply(null, vals);
  let h = '<div class="bars">';
  vals.forEach(function (v) {
    h += '<div class="b" style="height:' + Math.max(8, Math.round(v / max * 100)) + '%" title="' + v + '"></div>';
  });
  return h + '</div>';
}

  const tsc = { '每日 18:00 前': 'blue', '场次结束 2h 内': 'orange', '每周一 12:00 前': 'cyan', '每周五 18:00 前': 'cyan', '活动结束 24h 内': 'purple' };
  let rows = '';
  RTPLS.forEach(function (t, i) {
    rows += '<tr><td class="mono num" style="color:var(--blue)">' + t.no + '</td><td style="font-weight:500">' + t.name + '</td>' +
      '<td class="num">' + t.fields + ' 字段</td>' +
      '<td>' + tag(t.freq, tsc[t.freq] || 'gray') + '</td><td>' + t.owner + '</td><td class="num">' + t.use + ' 次</td>' +
      '<td><span class="sw' + (t.on ? ' on' : '') + '" onclick="this.classList.toggle(\'on\');toast(\'模板已' + (t.on ? '停用' : '启用') + '\',\'success\')"><i></i></span></td>' +
      '<td><span class="btn btn-sec btn-sm" onclick="reportTplEdit(' + i + ')">编辑</span></td></tr>';
  });
  return '<div class="hint" style="margin-bottom:10px">模板字段配置后，上报人按模板逐项填报（REPORT-001）；提交进入审核流，审核不通过将被退回补充（REPORT-003）。</div>' +
    tbl(['模板编号', '模板名称', '字段数', '上报频率', '责任部门', '累计使用', '启停', '操作'], rows);
}
function reportTplEdit(i) {
  const t = RTPLS[i];
  const fldRows = t.flds.map(function (f, j) {
    return '<tr><td style="font-weight:500"><span class="mono" style="font-size:10.5px;color:var(--text2)">F' + String(j + 1).padStart(2, '0') + '</span> ' + f.n + '</td>' +
      '<td>' + f.ty + '</td>' +
      '<td><span class="sw' + (f.req ? ' on' : '') + '" onclick="reportFldToggle(' + i + ',' + j + ',this)"><i></i></span></td>' +
      '<td style="font-size:11.5px;color:var(--text2)">' + f.rule + '</td>' +
      '<td><span class="btn btn-sec btn-sm" onclick="reportFldEdit(' + i + ',' + j + ')">编辑</span></td>' +
      '<td>' + (j > 0 ? '<span class="btn btn-sec btn-sm" style="padding:2px 8px" onclick="reportFldMove(' + i + ',' + j + ',-1)" title="上移">↑</span> ' : '') +
      (j < t.flds.length - 1 ? '<span class="btn btn-sec btn-sm" style="padding:2px 8px" onclick="reportFldMove(' + i + ',' + j + ',1)" title="下移">↓</span>' : '') + '</td>' +
      '<td><span class="btn btn-sm" style="color:var(--red);border-color:rgba(255,59,48,.35)" onclick="reportFldDel(' + i + ',' + j + ')">删除</span></td></tr>';
  }).join('');
  const body = frow([
    { k: 'tname', label: '模板名称', type: 'text', req: true, val: t.name },
    { k: 'tfreq', label: '上报频率', type: 'select', req: true, opts: ['每日 18:00 前', '场次结束 2h 内', '每周一 12:00 前', '每周五 18:00 前', '活动结束 24h 内'] },
    { k: 'towner', label: '责任部门', type: 'select', opts: ['运营中心', '直播运营', '内容中心', '数据中心', '商务外协'] }
  ]) + '<div class="dsec">字段列表（' + t.flds.length + ' 个 · 字段级编辑：增删改 / 必填切换 / 排序）</div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>字段名</th><th>类型</th><th>必填</th><th>校验规则</th><th>操作</th><th>排序</th><th></th></tr></thead><tbody>' +
    fldRows +
    '<tr><td colspan="7" style="padding:6px"><span class="btn btn-sec btn-sm" style="background:var(--orange);color:#fff;border-color:var(--orange)" onclick="reportFldAdd(' + i + ')">' + ic('plus', 13) + '新增字段</span></td></tr></tbody></table></div>' +
    '<div class="hint" style="margin-top:6px">字段修改保存后立即对后续上报生效；已提交的上报单仍按提交时模板校验。</div>';
  openDrawer('编辑上报模板 · ' + t.no, body,
    '<button class="btn btn-sec" onclick="closeDrawer()">取消</button><button class="btn btn-pri" onclick="reportTplSave(' + i + ')">保存模板</button>', '640px');
}
/* REPORT：字段必填切换 */
function reportFldToggle(i, j, sw) {
  const f = RTPLS[i].flds[j];
  if (!f) return;
  sw.classList.toggle('on');
  f.req = !f.req;
  toast('字段「' + f.n + '」已切换为' + (f.req ? '必填' : '选填'), 'success');
}
/* REPORT：字段排序（上移/下移） */
function reportFldMove(i, j, dir) {
  const flds = RTPLS[i].flds;
  const k = j + dir;
  if (k < 0 || k >= flds.length) return;
  const tmp = flds[j]; flds[j] = flds[k]; flds[k] = tmp;
  reportTplEdit(i);
  toast('字段已' + (dir < 0 ? '上移' : '下移') + '：' + flds[k].n, 'success');
}
/* REPORT：删除字段（确认） */
function reportFldDel(i, j) {
  const t = RTPLS[i];
  const f = t.flds[j];
  if (!f) return;
  confirmDlg('删除字段「' + f.n + '」？', '模板 ' + t.no + ' 将移除该字段（' + f.ty + (f.req ? ' · 必填' : '') + '），已提交的上报单不受影响。', '确认删除', function () {
    t.flds.splice(j, 1);
    t.fields = t.flds.length;
    if (state.page === 'report') renderPage();
    reportTplEdit(i);
    toast('字段已删除：' + f.n + '（剩余 ' + t.flds.length + ' 个字段）', 'success');
  }, { danger: true });
}
/* REPORT：新增字段表单 */
function reportFldAdd(i) {

function reportFldAddOk(i) {
  const t = RTPLS[i];
  if (!formValidate(['fn', 'ft'])) return;
  t.flds.push({ n: $('#F_fn').value.trim(), ty: $('#F_ft').value, req: $('#F_frq') ? ($('#F_frq').value === '必填') : true, rule: ($('#F_frule').value || '').trim() || '无特殊校验' });

/* REPORT：编辑单个字段 */
function reportFldEdit(i, j) {
  const t = RTPLS[i];
  const f = t.flds[j];
  if (!f) return;
  const body = frow([
    { k: 'fn', label: '字段名', type: 'text', req: true, val: f.n },
    { k: 'ft', label: '字段类型', type: 'select', req: true, opts: ['文本', '整数', '金额', '百分比', '日期', '枚举'], val: f.ty },
    { k: 'frq', label: '是否必填', type: 'pills', opts: ['必填', '选填'], val: f.req ? '必填' : '选填' },
    { k: 'frule', label: '校验规则', type: 'text', val: f.rule === '无特殊校验' ? '' : f.rule, ph: '如：≥ 0 或 0~100%（选填）', wide: true }
  ]);
  openDrawer('编辑字段 F' + String(j + 1).padStart(2, '0') + ' · ' + t.no, body,
    '<button class="btn btn-sec" onclick="closeDrawer()">取消</button><button class="btn btn-pri" onclick="reportFldEditOk(' + i + ',' + j + ')">保存字段</button>', '440px');
}
function reportFldEditOk(i, j) {
  const t = RTPLS[i];
  const f = t.flds[j];
  if (!f) return;
  if (!formValidate(['fn', 'ft'])) return;
  const old = f.n;
  f.n = $('#F_fn').value.trim();
  f.ty = $('#F_ft').value;
  f.req = $('#F_frq') ? ($('#F_frq').value === '必填') : f.req;
  f.rule = ($('#F_frule').value || '').trim() || '无特殊校验';
  closeDrawer();
  reportTplEdit(i);
  toast('字段已更新：' + old + (old !== f.n ? ' → ' + f.n : '') + '（' + f.ty + (f.req ? ' · 必填' : '') + '）', 'success');
}

function reportUplAudit(i, pass) {
  const u = UPLOADS[i];
  if (!u) return;
  if (pass) {
    confirmDlg('确认审核通过？', '上报单 ' + u.no + '（' + u.tpl + ' · ' + u.rows + ' 行）字段校验全部通过，数据将写入数据中心并同步 BI 报表。', '通过入仓', function () {
      u.st = '已通过';
      if (state.page === 'report') renderPage();
      toast('上报审核通过：' + u.no + '（已写入数据中心）', 'success');
      hlFirst();
    });
  } else {
    const body = frow([
      { k: 'ureason', label: '退回原因', type: 'select', req: true, opts: ['关键字段缺失', '数据口径不一致', '数值异常（超出阈值）', '附件格式错误', '其他'] },
      { k: 'unote2', label: '退回说明', type: 'textarea', req: true, ph: '具体指出需修正的字段与期望值', wide: true }
    ]);
    CF_CB = function () {
      if (!formValidate(['ureason', 'unote2'])) return;
      u.st = '已退回';
      if (state.page === 'report') renderPage();
      closeConfirm();
      toast('上报已退回：' + u.no + '（原因：' + $('#F_ureason').value + '），提交人需在 24h 内补充重报', 'warn');
      hlFirst();
    };
    const w = document.createElement('div');
    w.className = 'cfwrap on';
    w.innerHTML = '<div class="cfmask" onclick="closeConfirm()"></div>' +
      '<div class="cfcard" style="width:480px" role="dialog">' +
      '<div class="cf-t"><span class="cf-ic" style="color:var(--red)">' + ic('x', 20) + '</span><b>退回上报 · ' + u.no + '</b></div>' +
      '<div class="cf-m">' + body + '</div>' +
      '<div class="cf-f"><button class="btn btn-sec" onclick="closeConfirm()">取消</button>' +
      '<button class="btn btn-pri" style="background:var(--red)" onclick="doConfirm()">确认退回</button></div></div>';
    document.body.appendChild(w);
  }
}

/* FLOW-002：看板节点流转（当前节点审批通过 → 下一节点；到链尾归档） */
function flowKbNext(i) {
  const f = FLOWS[i];
  if (!f) return;
  const chain = f.chain || [];
  const ni = f.ni != null ? f.ni : chain.indexOf(f.node);
  const nextIdx = ni + 1;
  if (!chain.length || nextIdx >= chain.length) {
    confirmDlg('确认完成流程？', '流程 ' + f.id + '（' + f.type + ' · ' + f.from + '）已到达链尾节点，确认后归档为「已完成」。', '确认归档', function () {
      f.st = '已完成'; f.node = chain.length ? chain[chain.length - 1] : f.node;
      if (state.page === 'flow') renderPage();
      toast('流程已归档：' + f.id + '（' + f.type + ' · 全链路完成）', 'success');
      hlFirst();
    });
    return;
  }
  confirmDlg('确认流转至下一节点？', '流程 ' + f.id + '（' + f.type + '）当前节点「' + chain[ni] + '」审批通过，将流转至「<b>' + chain[nextIdx] + '</b>」并通知下一节点审批人。', '确认流转', function () {
    f.ni = nextIdx; f.node = chain[nextIdx]; f.st = '审批中'; f.cost = '0h';
    if (state.page === 'flow') renderPage();
    toast('已流转：' + f.id + ' → ' + chain[nextIdx] + '（已通知审批人）', 'success');

}

/* FIN-003：添加分成项（重渲染编辑抽屉） */
function finRuleItemAdd(i) {
  const r = FINRULES[i];
  finRuleGrab(i);
  r.body.push({ role: '新角色', pct: 10 });
  finRuleEdit(i);
  toast('已添加分成项（当前 ' + r.body.length + ' 项）', 'success');
}
/* FIN-003：删除分成项 */
function finRuleItemDel(i, j) {
  const r = FINRULES[i];
  if (r.body.length <= 1) { toast('至少保留一个分成项', 'warn'); return; }
  finRuleGrab(i);
  r.body.splice(j, 1);
  finRuleEdit(i);
  toast('分成项已删除（剩余 ' + r.body.length + ' 项）', 'success');
}
/* FIN-003：从当前抽屉输入抓取到数据（编辑/增删前暂存） */
function finRuleGrab(i) {
  const r = FINRULES[i];
  r.body.forEach(function (b, j) {
    const roleEl = $('#RI_role' + j), pctEl = $('#RI_pct' + j);
    if (roleEl) b.role = roleEl.value.trim() || b.role;
    if (pctEl) b.pct = Number(pctEl.value || 0);
  });
  const nameEl = $('#F_rname');
  if (nameEl) r.name = nameEl.value.trim() || r.name;
  const modeEl = $('#F_rmode');
  if (modeEl) r.mode = modeEl.value;
}
/* FIN-003：保存规则（多方模式校验合计 ≤100%） */
function finRuleSave(i) {
  const r = FINRULES[i];
  finRuleGrab(i);
  if (!formValidate(['rname', 'rmode'])) return;
  const sum = r.body.reduce(function (s, b) { return s + b.pct; }, 0);
  if (r.mode === '多方' && sum > 100) {
    toast('多方分成比例合计 ' + sum + '% 超 100%，无法保存（FIN-003）', 'error');
    return;
  }
  if (r.body.some(function (b) { return b.pct < 0 || b.pct > 100; })) {
    toast('分成比例须在 0~100% 之间', 'error');
    return;
  }
  if (state.page === 'fin') renderPage();
  closeDrawer();
  toast('分成规则已保存：' + r.no + ' · ' + r.name + '（' + r.mode + ' · 合计 ' + sum + '%）', 'success');
}

  openDrawer('新建分成规则', body,

function finRuleAddSubmit() {
  if (!formValidate(['nrname', 'nrbody'])) return;
  const lines = $('#F_nrbody').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  const body = lines.map(function (l) {
    const parts = l.split(/[,，]/);
    return { role: (parts[0] || '角色').trim(), pct: Number((parts[1] || '0').replace('%', '').trim()) || 0 };

  const no = 'SR-' + String(FINRULES.length + 1).padStart(3, '0');
  FINRULES.unshift({ no: no, name: $('#F_nrname').value.trim(), mode: mode, body: body, on: true, use: 0 });

  formOk(no, '分成规则已创建并启用（' + body.length + ' 项 · 合计 ' + sum + '%）', '');

}

/* 同规则分组（去重口径：规则名相同即视为同源；返回 [{rule, n, list, lvs}] 按数量降序） */
function alertDedupGroups() {
  const map = {};
  const order = [];
  ALERTS.forEach(function (a) {
    if (!map[a.rule]) { map[a.rule] = { rule: a.rule, list: [] }; order.push(a.rule); }
    map[a.rule].list.push(a);
  });
  const groups = order.map(function (r) { return map[r]; });
  groups.forEach(function (g) { g.n = g.list.length; });
  groups.sort(function (x, y) { return y.n - x.n; });
  return groups;
}

  if (state.bi.drill) state.bi.drill.path = [];
  if (state.page === 'bi') renderPage();

/* BI-002：下钻（维度值 → 场次明细） */
function biDrillDown(val) {

  if (!state.bi.drill) state.bi.drill = { cat: '直播', rpt: '场次分析', path: [] };
  state.bi.drill.path = [val];
  if (state.page === 'bi') renderPage();
  toast('下钻：' + (state.bi.dim || '平台') + ' → ' + val + '（显示场次明细）', 'success');

/* BI-002：面包屑回退（保留前 keep 层） */
function biDrillUp(keep) {
  if (state.bi && state.bi.drill) state.bi.drill.path = state.bi.drill.path.slice(0, keep);
  if (state.page === 'bi') renderPage();
  toast('已回退至第 ' + keep + ' 层下钻路径', 'success');
}
/* BI-002：重置下钻路径 */
function biDrillReset() {
  if (state.bi && state.bi.drill) state.bi.drill.path = [];

  h += tbl(['Key 编号', '归属人员', '角色', 'Key 哈希（掩码）', '状态', '授权资源', '累计调用', 'QPS 限额', 'IP 白名单', '最近调用', '有效期', '操作'], rows);
  h += '<div class="hint">' + ic('warn', 13) + ' 动态鉴权：每次调用实时校验人员在职状态与资源授权（缓存 60s，BR-021），钉钉离职事件即时吊销（BR-023）——Key-0005 即离职联动吊销示例。明文仅生成时展示一次（BR-020）。</div>';
  return h;
}
/* 审计监控页签 */
function airLogTab() {
  let h = '';
  let rows = '';
  AIRLOGS.forEach(function (l) {
    rows += '<tr><td class="num" style="font-size:12px">' + l.t + '</td>' +
      '<td class="mono" style="font-size:12px;color:var(--blue)">' + l.tool + '</td>' +
      '<td>' + l.user + '</td><td class="mono num" style="font-size:12px">' + l.key + '</td>' +
      '<td>' + (l.ok ? tag('成功', 'green') : tag('失败·' + l.code, 'red')) + '</td>' +
      '<td class="num">' + l.ms + ' ms</td><td style="font-size:12px;color:var(--text2)">' + l.auth + '</td></tr>';
  });
  h += qbar(qi('工具名/人员', 120) + qs(['全部结果', '成功', '失败'], 90) + qi('Key 编号', 100), 'qSave(\'airLog\')');
  h += tbl(['时间', 'MCP 工具', '调用人', 'Key', '结果', '耗时', '鉴权说明'], rows);
  h += '<div class="card" style="margin-top:16px"><div class="hd-row"><h3>用量统计（近 7 天）</h3></div><div class="bars" style="margin-top:12px">' +
    [412, 386, 295, 468, 521, 603, 1284].map(function (v) {
      const max = 1284;
      return '<div class="b" style="height:' + Math.round(v / max * 100) + '%" title="' + v + ' 次调用"></div>';
    }).join('') + '</div>' +
    '<div class="rowline" style="justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--text2)"><span>09-12</span><span>09-13</span><span>09-14</span><span>09-15</span><span>09-16</span><span>09-17</span><span>今天</span></div>' +
    '<div class="hint">审计日志全量落 ims_mcp_log（含鉴权上下文），失败调用重点跟踪 5007 检索超时与 401 鉴权失败（KEY-0004 停用 / KEY-0005 离职吊销样例）。</div></div>';
  return h;
}

function finReimburse() {

    { k: 'type', label: '报销类型', type: 'select', opts: ['差旅费', '业务招待费', '设备采购', '推广投放', '办公费用', '其他'] },

    { k: 'inv', label: '发票张数', type: 'num', unit: '张', val: 1, min: 1 },
    { k: 'file', label: '发票附件', type: 'file', ph: '点击上传发票扫描件（占位）', wide: true },
    { k: 'note', label: '备注', type: 'textarea', ph: '补充说明（选填）', wide: true }
  ]);
  openDrawer('费用报销申请', body,

function finReimburseSubmit() {
  if (!formValidate(['amt', 'reason'])) return;
  const no = 'BX20260912-' + String(Math.floor(Math.random() * 90) + 10);
  FLOWS.unshift({ id: 'FL20260912-' + String(FLOWS.length + 1).padStart(2, '0'), type: '报销', from: ROLES[state.role].user, node: '财务复核', approver: '周晴', cost: '0h', st: '审批中', chain: ['提交报销', '财务复核', '出纳付款', '归档'], ni: 1 });
  formOk(no, '报销单已提交，进入「财务复核」审批节点（审批人：周晴）', '');
  toast('报销单提交成功：' + no + ' · ' + fmtMoney(Number($('#F_amt').value || 0)), 'success');
}

document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
    e.preventDefault();
    const s = $('#gsearch');
    if (s) { s.focus(); toast('已聚焦全局搜索 · ⌘K', 'success'); }
  }
});
