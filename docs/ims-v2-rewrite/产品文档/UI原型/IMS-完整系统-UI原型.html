<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS 一体化管理系统 · 完整 UI 原型 v2.6.4</title>
<style>
/* ===================== 设计令牌 ===================== */
:root{
  --bg:#f5f5f7; --card:#ffffff; --text:#1d1d1f; --text2:#86868b;
  --blue:#0071e3; --blue-h:#0077ed; --blue-bg:#e8f2fe;
  --green:#34c759; --orange:#ff9500; --red:#ff3b30; --gray:#8e8e93;
  --cyan:#5ac8fa; --purple:#af52da; --yellow:#ffcc00;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.12);
  --sh:0 1px 3px rgba(0,0,0,.06); --sh-h:0 4px 12px rgba(0,0,0,.10);
  --r:12px; --r-s:8px; --r-xs:5px;
  --spring:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;letter-spacing:0}
.masked{color:var(--text2);font-style:italic;letter-spacing:2px}

/* ===================== 布局骨架 ===================== */
.app{display:flex;height:100vh;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto;padding:28px 32px}
.page{max-width:1240px;margin:0 auto}

/* ===================== 侧边栏 ===================== */
.sidebar{width:232px;flex:none;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{padding:20px 18px 12px}
.logo b{font-size:16px;font-weight:700;letter-spacing:-.4px;display:block;line-height:1.15}
.logo small{display:block;font-size:10px;color:var(--text2);font-weight:500;letter-spacing:1.5px;margin-top:3px}
.nav{flex:1;overflow-y:auto;padding:4px 10px 10px}
.nav-g-h{display:flex;align-items:center;padding:12px 8px 4px;font-size:11px;color:var(--text2);font-weight:600;cursor:pointer;letter-spacing:.6px;user-select:none}
.nav-g-h .caret{margin-left:auto;transition:transform .2s ease;color:var(--text2)}
.nav-g.closed .caret{transform:rotate(-90deg)}
.nav-g.closed .nav-item{display:none}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--r-s);color:var(--text);cursor:pointer;font-size:13px;transition:background .15s;margin:1px 0}
.nav-item:hover{background:rgba(0,0,0,.045)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:500}
.nav-item .nc{font-size:10px;color:var(--text2);margin-left:auto;letter-spacing:.4px;font-family:ui-monospace,Menlo,monospace}
.nav-item.active .nc{color:var(--blue)}
.nav-item.sub{padding-left:28px;font-size:12.5px}
.nav-item.sub .nc{display:none}
.nav-sub-g{margin:2px 0 6px}
.nav-sub-g .nav-item.nav-parent{font-weight:500}
.nav-sub-g .nav-item.nav-parent .caret{margin-left:6px;transition:transform .2s ease;color:var(--text2);flex:none}
.nav-sub-g.closed .nav-item.sub{display:none}
.nav-sub-g.closed .nav-item.nav-parent .caret{transform:rotate(-90deg)}
.uCard{margin:10px;padding:10px 12px;background:var(--card);border-radius:var(--r-s);box-shadow:var(--sh);display:flex;align-items:center;gap:10px}
.uCard .av{flex:none}
.uCard .un{font-size:12.5px;font-weight:600;line-height:1.3}
.uCard .ur{font-size:11px;color:var(--text2)}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--blue);flex:none}

/* ===================== 顶栏 ===================== */
.topbar{height:56px;flex:none;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:20}
.crumb{font-size:13px;color:var(--text2);white-space:nowrap}
.crumb b{color:var(--text);font-weight:500}
.search{flex:1;max-width:400px;margin:0 auto;position:relative}
.search svg{position:absolute;left:9px;top:8px;color:var(--text2)}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 44px 0 32px;font-size:12.5px;background:rgba(0,0,0,.02);outline:none;font-family:var(--font);transition:all .18s}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,113,227,.14)}
.kbd{position:absolute;right:8px;top:7px;font-size:10px;color:var(--text2);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;background:#fff}
.tb-ic{position:relative;cursor:pointer;color:var(--text2);display:flex;padding:7px;border-radius:var(--r-s);transition:background .15s}
.tb-ic:hover{background:var(--bg);color:var(--text)}
.badge{position:absolute;top:1px;right:0;background:var(--red);color:#fff;font-size:9px;font-weight:600;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.rolebtn{display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line2);border-radius:var(--r-s);cursor:pointer;font-size:12.5px;background:#fff;transition:all .15s;white-space:nowrap}
.rolebtn:hover{border-color:rgba(0,113,227,.4);color:var(--blue)}
.rolebtn .av{width:22px;height:22px;font-size:11px}
.rolebtn svg{color:var(--text2)}
.rolemenu{position:fixed;top:54px;right:20px;width:264px;background:#fff;border-radius:var(--r);box-shadow:0 10px 36px rgba(0,0,0,.18);padding:6px;z-index:150;display:none;border:1px solid var(--line)}
.rolemenu.on{display:block;animation:pop .18s ease}
.rm-h{font-size:11px;color:var(--text2);padding:7px 10px 4px;font-weight:600;letter-spacing:.5px}
.rm-i{display:flex;gap:9px;padding:8px 10px;border-radius:var(--r-s);cursor:pointer;align-items:center}
.rm-i:hover{background:var(--bg)}
.rm-i.on{background:var(--blue-bg);color:var(--blue)}
.rm-i .rn{font-size:12.5px;font-weight:500;line-height:1.3}
.rm-i .rr{font-size:11px;color:var(--text2)}
.rm-i.on .rr{color:var(--blue)}
.rm-i .rc{font-size:10px;color:var(--text2);border:1px solid var(--line2);padding:1px 5px;border-radius:4px;margin-left:auto;font-family:ui-monospace,Menlo,monospace}

/* ===================== 按钮 / 标签 / 表格 ===================== */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;border-radius:var(--r-s);font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:var(--font);transition:all .18s ease;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-h);transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,113,227,.28)}
.btn-sec{background:#fff;border-color:var(--line2);color:var(--text)}
.btn-sec:hover{background:var(--bg);transform:translateY(-1px)}
.btn-sm{height:26px;padding:0 11px;font-size:12px;border-radius:var(--r-xs)}
.btn-txt{background:none;color:var(--blue);padding:0 6px;height:auto}
.btn-txt:hover{background:var(--blue-bg);border-radius:var(--r-xs)}
.btn-pill{border-radius:980px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-xs);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
/* v2.6.34：所有列表页统一分页组件（§全局开发规范 2.5） */
.tbl-block>.tbl-wrap{border-radius:var(--r) var(--r) 0 0}
.pager{display:flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--line);margin-top:-1px;border-radius:0 0 var(--r) var(--r);background:#fff;font-size:12px;color:var(--c-sub)}
.pager .pg-total{white-space:nowrap}
.pager .pg-size{height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;color:inherit;padding:0 4px}
.pager .pg-sp{flex:1}
.pager .pg-n{min-width:26px;height:26px;line-height:24px;text-align:center;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:0 6px;user-select:none}
.pager .pg-n:hover{border-color:var(--blue);color:var(--blue)}
.pager .pg-n.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pager .pg-n.dis{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.3px;border-bottom:1px solid var(--line);background:#fafafc;white-space:nowrap}
tbody td{padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:#f5f5f7}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red);font-weight:600}
.pos{color:#1e8e3e;font-weight:600}

/* ===================== 工作任务 · 任务管理矩阵（两级合并表头 · 对齐 OPS WorkTaskMatrixTable.vue） ===================== */
.wt-matrix-summary{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:12px;padding:12px 16px;background:#fafafc;border:1px solid var(--line);border-radius:var(--r-s)}
.wt-matrix-summary .sm{display:flex;flex-direction:column;min-width:72px}
.wt-matrix-summary .sm .lb{font-size:11px;color:var(--text2)}
.wt-matrix-summary .sm .vv{font-size:18px;font-weight:600;line-height:1.3}
.wt-matrix-summary .sm.live .vv{color:var(--green)}
.wt-matrix-summary .sm.paid .vv{color:var(--orange)}
.wt-matrix-summary .sm.red .vv{color:var(--red)}
.wt-matrix-scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:#fff}
table.wt-matrix{min-width:100%;border-collapse:collapse;font-size:13px}
table.wt-matrix th,table.wt-matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap;vertical-align:middle}
table.wt-matrix thead th{background:#f2f2f4;color:var(--text);font-size:12px}
table.wt-matrix tr.hg th{font-weight:600}
table.wt-matrix tr.hs th{font-weight:500;font-size:11.5px;color:var(--text2)}
table.wt-matrix .fx{background:#fafafc;z-index:2}
table.wt-matrix .col-date{min-width:54px}
table.wt-matrix td.date-cell{color:var(--blue);font-weight:600;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:2px;font-size:12px}
table.wt-matrix .session-no{color:var(--red);font-weight:600}
table.wt-matrix .match-name{color:var(--blue);font-weight:500;cursor:pointer}
table.wt-matrix .plan-badge{display:inline-block;padding:2px 9px;border-radius:999px;color:#fff;font-size:11.5px;font-weight:500}
table.wt-matrix .plan-badge.b-live{background:var(--green)}
table.wt-matrix .plan-badge.b-paid{background:var(--orange)}
table.wt-matrix .plan-badge.b-drain{background:var(--blue)}
table.wt-matrix .win-badge{display:inline-block;padding:2px 8px;border-radius:var(--r-xs);color:#fff;font-size:11.5px}
table.wt-matrix .win-badge.w-red{background:var(--red)}
table.wt-matrix .win-badge.w-black{background:#303133}
table.wt-matrix .cell-empty{color:var(--text2)}
table.wt-matrix .plat-tag{display:inline-block;margin:0 2px}

/* ===================== 查询栏 ===================== */
.qbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto}
.qbar input,.qbar select{height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;font-size:12.5px;background:#fff;color:var(--text);font-family:var(--font);outline:none;flex:none;transition:border-color .15s}
.qbar input:focus,.qbar select:focus{border-color:var(--blue)}
.qbar .sp{flex:1}
.qbar label{font-size:12px;color:var(--text2);flex:none}

/* ===================== 页头 / 卡片 / 网格 ===================== */
.pg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.pg-h h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1.07}
.pg-h .sub{font-size:13px;color:var(--text2);margin-top:5px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;transition:box-shadow .2s,transform .2s}
.card.hov{cursor:pointer}
.card.hov:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
.card h3{font-size:17px;font-weight:600;letter-spacing:-.2px;margin-bottom:4px}
.card .csub{font-size:12px;color:var(--text2)}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:16px}
.g2r{display:grid;grid-template-columns:2fr 3fr;gap:16px}
.qb-layout{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;margin-top:4px}
.qb-side{border:1px solid var(--line);border-radius:var(--r-s);padding:10px;font-size:12px;max-height:440px;overflow:auto;background:#fafafc}
.qb-side .fi{padding:6px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;line-height:1.35}
.qb-side .fi:hover{background:var(--blue-bg);color:var(--blue)}
.qb-form .qb-row{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:12.5px}
.qb-form .qb-row>label{color:var(--text2);text-align:right;font-size:12px}
.collapse-h{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;flex:1}
.collapse-h .caret{font-size:10px;color:var(--text2);transition:transform .2s;display:inline-block;width:12px}
.collapse-h.collapsed .caret{transform:rotate(-90deg)}
.qb-cond-hd{margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
/* BI0 自定义查询 · scoped 视觉（布局 SSOT 不变） */
.page-bi0-query{margin-top:-2px}
.page-bi0-query>.tabs{margin-bottom:14px}
.page-bi0-query .bi0-config-card{padding:16px 20px}
.page-bi0-query .bi0-config-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-bi0-query .bi0-config-hd .collapse-h h3{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
.page-bi0-query .bi0-config-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.page-bi0-query .bi0-qb-root.qb-layout,.drawer-b .bi0-qb-root.qb-layout{grid-template-columns:minmax(0,1fr) minmax(200px,228px);gap:14px;margin-top:0}
.page-bi0-query .bi0-qb-root .qb-form,.drawer-b .bi0-qb-root .qb-form{background:#fafafc;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.page-bi0-query .bi0-qb-root .qb-form .qb-row,.drawer-b .bi0-qb-root .qb-form .qb-row{grid-template-columns:88px 1fr;gap:10px 14px;margin-bottom:12px}
.page-bi0-query .bi0-qb-root .qb-form select,.drawer-b .bi0-qb-root .qb-form select{height:32px;border:1px solid var(--line2);border-radius:var(--r-xs);font-size:12.5px;background:#fff}
.page-bi0-query .qb-val,.drawer-b .bi0-qb-root .qb-val{font-size:13px;font-weight:500;color:var(--text)}
.page-bi0-query .qb-val-muted,.drawer-b .bi0-qb-root .qb-val-muted{font-size:12.5px;color:var(--text2);line-height:1.45}
.page-bi0-query .qb-chips,.drawer-b .bi0-qb-root .qb-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.page-bi0-query .bi0-qb-root .qb-cond-hd,.drawer-b .bi0-qb-root .qb-cond-hd{margin:16px 0 10px;padding-top:14px}
.page-bi0-query .bi0-qb-root .qb-cond-hd b,.drawer-b .bi0-qb-root .qb-cond-hd b{font-size:13px;font-weight:600}
.page-bi0-query .bi0-qb-root .qb-cond-body .tbl-wrap,.drawer-b .bi0-qb-root .qb-cond-body .tbl-wrap{margin-top:0}
.page-bi0-query .bi0-qb-root .qb-cond-add,.drawer-b .bi0-qb-root .qb-cond-add{margin-top:10px}
.page-bi0-query .bi0-qb-root .qb-side,.drawer-b .bi0-qb-root .qb-side{display:flex;flex-direction:column;background:#fff;box-shadow:var(--sh);padding:12px 14px;max-height:480px;border-color:var(--line)}
.page-bi0-query .bi0-qb-root .qb-side-hd,.drawer-b .bi0-qb-root .qb-side-hd{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35}
.page-bi0-query .bi0-qb-root .qb-side .fi,.drawer-b .bi0-qb-root .qb-side .fi{border:1px solid transparent;transition:background .15s,border-color .15s}
.page-bi0-query .bi0-qb-root .qb-side .fi:hover,.drawer-b .bi0-qb-root .qb-side .fi:hover{border-color:rgba(0,113,227,.22)}
.page-bi0-query .bi0-qb-root .code-edit,.drawer-b .bi0-qb-root .code-edit{background:#f6f8fa;margin-top:0}
.page-bi0-query .bi0-result-card{margin-top:16px;padding:16px 20px}
.drawer-b .bi0-result-card{margin-top:0;padding:0;box-shadow:none;border-radius:0}
.page-bi0-query .bi0-result-hd{margin-bottom:12px}
.page-bi0-query .bi0-result-hd .collapse-h b{font-size:14px;font-weight:600}
.page-bi0-query .bi0-result-tabs.tabs{margin:8px 0 12px}
.page-bi0-query .bi0-chart-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.page-bi0-query .bi0-chart-ph,.drawer-b .bi0-chart-ph{height:160px;background:var(--bg);border:1px dashed var(--line2);border-radius:var(--r-s);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:12.5px}
.page-bi0-query .bi0-chart-stage,.drawer-b .bi0-chart-stage{min-height:200px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;margin-top:2px}
.page-bi0-query .bi0-mine-card{padding:0;overflow:hidden}
.page-bi0-query .bi0-mine-hd{padding:16px 20px 0}
.page-bi0-query .bi0-mine-body{padding:0 20px 18px}
.page-bi0-query .bi0-mine-body .qbar{margin-bottom:12px}
.page-bi0-query .bi0-foot{margin-top:12px}
.page-query-tool{margin-top:-2px}
.page-query-tool>.mode-tabs{margin-bottom:14px}
.page-query-tool .qt-config-card,.page-query-tool .qt-trace-entry-card{padding:16px 20px;margin-bottom:16px}
.page-query-tool .bi0-config-hd .collapse-h h3{font-size:17px;font-weight:600;margin:0;letter-spacing:-.2px}
.page-query-tool .qt-level-steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
.page-query-tool .qt-level-steps .chip{cursor:pointer;border:1px solid var(--line2);background:#fff;margin-right:0}
.page-query-tool .qt-level-steps .chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.page-query-tool .qt-level-steps .csub{font-size:11px;margin:0 2px}
.page-query-tool .qt-drill-levels .tbl-wrap{margin-top:0}
.page-query-tool .qt-drill-levels td{vertical-align:top;padding:10px 8px}
.page-query-tool .qt-drill-levels .qb-chips{gap:4px}
.page-query-tool .qt-drill-levels .chip.field-chip{cursor:pointer;margin:0}
.page-query-tool .qt-drill-levels .chip.field-chip.off{background:rgba(0,0,0,.04);color:var(--text2);border:1px dashed var(--line2)}
.page-query-tool .qt-join-arrow{text-align:center;color:var(--text2);font-size:11px;padding:4px 0}
.page-query-tool .qt-trace-chain{font-size:12px;color:var(--text2);line-height:1.6;padding:10px 12px;background:#fafafc;border:1px solid var(--line);border-radius:var(--r-s);margin-top:10px}
.page-query-tool .qt-trace-run{margin-top:14px}
.page-query-tool .qt-trace-run .dc-trace-split{min-height:360px}

.drawer-b .page-query-tool .qt-drill-levels .qb-chips{gap:4px}
.drawer-b .page-query-tool .qt-drill-levels .chip.field-chip{cursor:pointer;margin:0}

.drawer-b .page-query-tool .qt-qctl,.drawer-b .page-query-tool .qb-form select,.drawer-b .page-query-tool .qb-form input:not(.code-edit){height:30px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;font-size:12.5px;background:#fff;color:var(--text);font-family:var(--font);outline:none;transition:border-color .15s}
.drawer-b .page-query-tool .qt-qctl:focus,.drawer-b .page-query-tool .qb-form select:focus,.drawer-b .page-query-tool .qb-form input:focus{border-color:var(--blue)}
.drawer-b .page-query-tool .qt-trace-chain{font-size:12px;color:var(--text2);line-height:1.6;padding:10px 12px;background:#fafafc;border:1px solid var(--line);border-radius:var(--r-s);margin-top:10px}
.drawer-b .page-query-tool .qt-result-empty{padding:24px 16px;text-align:center;color:var(--text2);border:1px dashed var(--line2);border-radius:var(--r-s);background:#fafafc;font-size:12.5px}

.desc-grid .dv{background:#fff}
.pag-mock{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--text2);flex-wrap:wrap}

.code-edit{width:100%;min-height:88px;font-family:ui-monospace,monospace;font-size:11px;line-height:1.45;border:1px solid var(--line);border-radius:var(--r-s);padding:10px;resize:vertical;color:#24292f;background:#fff}
.bi-dsn{display:grid;grid-template-columns:188px 1fr 228px;gap:12px;min-height:400px;margin-top:12px}

.bi-canvas{background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,0,0,.04) 39px,rgba(0,0,0,.04) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,0,0,.04) 39px,rgba(0,0,0,.04) 40px);border:1px dashed var(--line2);border-radius:8px;min-height:360px;padding:10px;position:relative}
.bi-wgt{display:inline-block;vertical-align:top;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:11.5px;margin:4px;min-width:100px;box-shadow:var(--sh)}
.code-mock{font-family:ui-monospace,monospace;font-size:11px;line-height:1.45;background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;color:#24292f;max-height:200px;overflow:auto}
/* ===================== 17b 报表设计器（DW bi-designer 对标） ===================== */
.bidsn{display:grid;grid-template-columns:198px minmax(0,1fr) 272px;gap:12px;align-items:start}
.bidsn-l,.bidsn-r{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:660px;overflow:auto}
.bidsn-mid{min-width:0}
.bidsn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.bidsn-top .nm{font-size:14px;font-weight:600}
.bidsn-top .sp{flex:1}
.comp-grp{font-size:11px;color:var(--text2);font-weight:600;margin:11px 0 6px;letter-spacing:.2px}
.comp-grp:first-child{margin-top:0}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.comp-cell{display:flex;align-items:center;gap:5px;padding:7px 7px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:grab;font-size:11.5px;transition:all .15s;user-select:none;white-space:nowrap;overflow:hidden}
.comp-cell:hover{border-color:rgba(0,113,227,.45);background:var(--blue-bg);color:var(--blue)}
.comp-cell:active{cursor:grabbing}
.comp-cell .ci{font-size:13px;line-height:1}
.bidsn-cwrap{overflow:auto;background:#fafafc;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:566px}
.bidsn-canvas{position:relative;width:1060px;height:600px;background-color:#fff;background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:40px 40px;border:1px dashed var(--line2);border-radius:8px}
.bidsn-canvas.dragover{outline:2px dashed var(--blue);outline-offset:3px}
.bidsn-cmp{position:absolute;border:1px solid var(--line2);border-radius:8px;background:#fff;box-shadow:var(--sh);overflow:hidden;cursor:move}
.bidsn-cmp.sel{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,113,227,.18)}
.bidsn-cmp .bc-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;background:#fafafc;border-bottom:1px solid var(--line);font-size:11px;color:var(--text2);overflow:hidden}
.bidsn-cmp .bc-h .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidsn-cmp .bc-x{flex:0 0 auto;opacity:0;cursor:pointer;color:var(--red);transition:opacity .15s}
.bidsn-cmp:hover .bc-x{opacity:1}
.bidsn-cmp .bc-b{height:calc(100% - 24px);overflow:hidden;display:flex;align-items:center;justify-content:center}
.bidsn-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2);gap:6px;font-size:12px}
.layer-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:11.5px}
.layer-item{padding:3px 9px;border-radius:6px;background:rgba(0,0,0,.04);color:var(--text2);cursor:pointer;transition:all .15s}
.layer-item:hover{background:var(--blue-bg);color:var(--blue)}
.layer-item.sel{background:var(--blue-bg);color:var(--blue);font-weight:600}
.prop-sec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.prop-hd{padding:8px 10px;background:#fafafc;font-size:12px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.prop-bd{padding:10px;border-top:1px solid var(--line)}
.prop-bd .fld{margin-bottom:9px}
.prop-bd .fld:last-child{margin-bottom:0}
.prop-bd .fld>label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px}
.prop-bd .fld input,.prop-bd .fld select{width:100%;height:29px;border:1px solid var(--line2);border-radius:6px;padding:0 8px;font-size:12px;font-family:var(--font);outline:none;background:#fff;color:var(--text)}
.prop-bd .fld input:focus,.prop-bd .fld select:focus{border-color:var(--blue)}
.prop-bd .p2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk-line{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0;color:var(--text);cursor:pointer}
.chk-line input{width:auto;height:auto;margin:0}
/* ===================== 17b 报表列表（DW bi-list 对标） ===================== */
.bi-lay{display:flex;gap:14px;align-items:flex-start}
.bi-tree{width:214px;flex:0 0 214px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px}
.bi-tree .tt{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;letter-spacing:.2px}
.bi-ti{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--text2);transition:all .15s;user-select:none}
.bi-ti:hover{background:rgba(0,0,0,.035);color:var(--text)}
.bi-ti.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
.bi-ti .cnt{margin-left:auto;font-size:10.5px;color:var(--text2);background:rgba(0,0,0,.05);border-radius:8px;padding:0 6px;line-height:16px}
.bi-ti.on .cnt{color:var(--blue);background:rgba(0,113,227,.12)}
.bi-ti.sub{padding-left:22px}
.bi-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
.bi-card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer;transition:all .18s}
.bi-card:hover{box-shadow:var(--sh-h);transform:translateY(-1px);border-color:rgba(0,113,227,.35)}
.bi-thumb{position:relative;height:124px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden}
.bi-thumb.light{background:linear-gradient(135deg,#f2f7ff,#eaf6f1)}
.bi-thumb.dark{background:linear-gradient(135deg,#16233d,#0b1930)}
.bi-thumb .bdg{position:absolute;top:8px;left:8px;font-size:10.5px}
.bi-thumb .ha{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .18s}
.bi-card:hover .bi-thumb .ha{opacity:1}
.bi-thumb .ha button{width:24px;height:24px;border-radius:6px;border:none;background:rgba(255,255,255,.94);box-shadow:var(--sh);cursor:pointer;font-size:12px;line-height:1;padding:0}
.bi-info{padding:10px 12px}
.bi-info h4{font-size:13.5px;font-weight:600;margin-bottom:6px;display:flex;align-items:baseline;gap:5px}
.bi-info h4 .n{font-size:11px;color:var(--text2);font-weight:400}
.bi-meta{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--text2);margin-bottom:8px}
.bi-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bi-tags{display:flex;gap:4px;flex-wrap:wrap}
.bi-lthumb{width:66px;height:38px;border-radius:5px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f2f7ff,#e9f4f1);cursor:pointer}
.bi-lthumb.dark{background:linear-gradient(135deg,#1a2f52,#0b1930)}
.bi-viewsw{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.bi-viewsw button{border:none;background:#fff;padding:4px 11px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--font)}
.bi-viewsw button.on{background:var(--blue-bg);color:var(--blue);font-weight:600}
/* 预览页 / 发布 */
.bi-pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin-bottom:12px;font-size:12.5px}
.bi-pv-bar input,.bi-pv-bar select{height:29px;border:1px solid var(--line2);border-radius:6px;padding:0 8px;font-size:12px;font-family:var(--font);background:#fff;color:var(--text)}
.bi-status{font-size:11.5px;color:var(--text2);margin:0 0 12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.bi-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px}
.bi-pv-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.bi-pv-kpi .k{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.bi-pv-kpi .k .v{font-size:24px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-bottom:4px}
.bi-pv-kpi .k .l{font-size:11.5px;color:var(--text2)}
.bi-pv-kpi .k .c{font-size:11.5px;margin-top:6px}
.bi-pv-grid{display:grid;grid-template-columns:3fr 2fr;gap:14px;margin-bottom:14px}
.bi-chartbox{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.bi-chartbox .t{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bi-chartbox .t .s{font-size:11px;color:var(--text2);font-weight:400}
/* 异步任务卡（V3-B6） */
.bi-asynccard{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(255,149,0,.35);background:rgba(255,149,0,.06);border-radius:10px;padding:12px 14px}
.bi-asynccard .ai{font-size:20px;line-height:1}
.bi-asynccard .at{font-size:13px;font-weight:600;margin-bottom:4px}
.bi-asynccard .ad{font-size:12px;color:var(--text2);line-height:1.6}
.bi-asynccard .aa{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.screen-dark{background:linear-gradient(180deg,#0d1117 0%,#161b22 100%);color:#e6edf3;border-radius:12px;padding:14px;border:1px solid #30363d}
.screen-dark .stat .l{color:#8b949e}
.screen-dark .stat .n{color:#f0f6fc}
.screen-dark .card{background:rgba(255,255,255,.04);box-shadow:none;border:1px solid #30363d}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{display:flex;flex-direction:column}
.stat .l{font-size:12px;color:var(--text2)}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .n small{font-size:12px;font-weight:500;color:var(--text2);letter-spacing:0}
.stat .d{font-size:11.5px;margin-top:8px;color:var(--text2)}
.sec{font-size:16px;font-weight:600;letter-spacing:-.2px;margin:20px 0 12px}
.hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd-row h3{font-size:17px;font-weight:600;letter-spacing:-.2px}

/* ===================== Tab ===================== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue);border-color:var(--blue);font-weight:500}
/* 分类 Tab（带计数徽标） */
.cattabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cattab{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;font-size:12.5px;color:var(--text2);cursor:pointer;border:1px solid var(--line2);border-radius:18px;background:#fff;transition:all .15s;user-select:none}
.cattab:hover{border-color:rgba(0,113,227,.4);color:var(--blue)}
.cattab.on{color:var(--blue);border-color:var(--blue);background:var(--blue-bg);font-weight:500}
.cbadge{font-size:10.5px;color:var(--text2);background:rgba(0,0,0,.05);border-radius:8px;padding:0 6px;line-height:16px;font-family:ui-monospace,Menlo,monospace}
.cattab.on .cbadge{color:var(--blue);background:rgba(0,113,227,.12)}
/* ===================== 考试/问卷题目组件 ===================== */
.wiz-steps{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.wiz-steps .ws{flex:1;min-width:72px;text-align:center;font-size:11px;padding:8px 6px;border-radius:8px;background:var(--bg);color:var(--text2);border:1px solid var(--line)}
.wiz-steps .ws.on{background:var(--blue-bg);color:var(--blue);border-color:rgba(0,113,227,.25);font-weight:600}
.wiz-steps .ws.done{background:#e8f8ec;color:var(--green);border-color:rgba(52,199,89,.3)}
.wiz-prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0}
.wiz-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .35s ease}
.qz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qz-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qz-item{padding:14px 0;border-bottom:1px solid var(--line)}
.qz-item:last-child{border-bottom:none}
.qz-q{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:10px}
.qz-q .qno{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:6px;background:rgba(0,113,227,.1);color:var(--blue);font-size:11.5px;font-weight:700;margin-right:8px;font-family:ui-monospace,Menlo,monospace}
.qz-q .qscore{font-size:11.5px;color:var(--text2);font-weight:500;margin-left:6px}
.qz-opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r-s);margin-bottom:7px;cursor:pointer;transition:all .15s;font-size:13px;line-height:1.5}
.qz-opt:hover{border-color:rgba(0,113,227,.4);background:rgba(0,113,227,.04)}
.qz-opt.on{border-color:var(--blue);background:rgba(0,113,227,.08);color:var(--blue);font-weight:500}
.qz-opt .ol{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text2);margin-top:1px}
.qz-opt.on .ol{border-color:var(--blue);background:var(--blue);color:#fff}
.qz-opt.right{border-color:var(--green);background:rgba(52,199,89,.08)}
.qz-opt.right .ol{border-color:var(--green);background:var(--green);color:#fff}
.qz-opt.wrong{border-color:var(--red);background:rgba(255,59,48,.07)}
.qz-opt.wrong .ol{border-color:var(--red);background:var(--red);color:#fff}
.qz-ana{font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px;padding:8px 10px;background:rgba(0,0,0,.03);border-radius:var(--r-s)}
.qz-timer{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--orange);font-weight:600;font-family:ui-monospace,Menlo,monospace}
.qz-result{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 10px 18px}
.qz-result .rscore{font-size:52px;font-weight:700;letter-spacing:-2px;line-height:1;margin:10px 0 4px}
.qz-result .rsub{font-size:12.5px;color:var(--text2);line-height:1.6}
.qz-gradeitem{padding:11px 0;border-bottom:1px solid var(--line)}
.qz-gradeitem:last-child{border-bottom:none}

/* ===================== 抽屉 / 遮罩 / 消息 ===================== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:100;display:flex;flex-direction:column;transform:translateX(103%);transition:transform .3s var(--spring);box-shadow:-10px 0 40px rgba(0,0,0,.14);width:720px}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.drawer-h b{font-size:16px;font-weight:600;letter-spacing:-.3px}
.dr-x{cursor:pointer;color:var(--text2);padding:6px;border-radius:var(--r-s);display:flex;transition:all .15s}
.dr-x:hover{background:var(--bg);color:var(--text)}
.drawer-b{flex:1;overflow-y:auto;padding:20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:none;background:#fff}
.msgdrawer{position:fixed;top:0;right:0;height:100vh;background:#fff;z-index:100;display:flex;flex-direction:column;transform:translateX(103%);transition:transform .3s var(--spring);box-shadow:-10px 0 40px rgba(0,0,0,.14);width:420px}
.msgdrawer.on{transform:none}
.mg-list{flex:1;overflow-y:auto}
.mg-i{display:flex;gap:10px;padding:13px 18px;border-bottom:1px solid rgba(0,0,0,.05);cursor:pointer;transition:background .12s;align-items:flex-start}
.mg-i:hover{background:var(--bg)}
.mg-i .mt{font-size:13px;font-weight:500;line-height:1.4}
.mg-i .mc{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4}
.mg-i .md{font-size:11px;color:var(--text2);margin-top:4px}
.mg-ud{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;margin-top:6px}
.mg-i.read .mg-ud{background:transparent}

/* ===================== Toast / 空状态 / 杂项 ===================== */
.toasts{position:fixed;top:16px;right:16px;z-index:220;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.16);padding:11px 15px;font-size:13px;font-weight:500;animation:tin .28s var(--spring);min-width:220px}
.toast.t-success{color:#1e8e3e}
.toast.t-warn{color:#c46a00}
.toast.t-error{color:#d70015}
.toast.out{opacity:0;transform:translateX(18px);transition:all .3s}
@keyframes tin{from{transform:translateX(24px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}}
.empty{padding:44px 20px;text-align:center;color:var(--text2)}
.empty svg{margin-bottom:10px;opacity:.5}
.empty .et{font-size:13px;font-weight:500;color:var(--text2)}
.empty .es{font-size:12px;margin-top:3px}
.pg{height:6px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden;min-width:56px;display:inline-block;vertical-align:middle}
.pg i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.sw{width:38px;height:23px;border-radius:12px;background:#d9d9de;display:inline-flex;align-items:center;padding:2px;cursor:pointer;transition:background .2s;flex:none}
.sw i{width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on i{transform:translateX(15px)}
.tl{position:relative;margin:4px 0 0 8px}
.tl::before{content:'';position:absolute;left:4px;top:8px;bottom:12px;width:2px;background:rgba(0,0,0,.08)}
.tl-i{position:relative;padding:0 0 18px 20px}
.tl-i::before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.tl-i.gg::before{background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.tl-i.oo::before{background:var(--orange);box-shadow:0 0 0 3px rgba(255,149,0,.18)}
.tl-i .tt{font-size:13px;font-weight:500}
.tl-i .td{font-size:11.5px;color:var(--text2);margin-top:1px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin:4px 0}
.kv>div{min-width:0}
.kv .k{font-size:11.5px;color:var(--text2);margin-bottom:2px}
.kv .v{font-size:13px;font-weight:500}
.dsec{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.5px;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.dsec:first-child{margin-top:0;padding-top:0;border-top:none}
.hint{font-size:11.5px;color:var(--text2);margin-top:6px}
.rowline{display:flex;align-items:center;gap:10px}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:4px}
.bars .b{flex:1;border-radius:4px 4px 0 0;background:var(--blue);opacity:.9;min-width:8px;transition:opacity .15s}
.bars .b:hover{opacity:1;background:var(--blue-h)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-xs);font-size:11.5px;background:rgba(0,113,227,.1);color:var(--blue);font-weight:500;margin-right:6px}
/* 多选选择器外观（对齐 OPS el-select multiple collapse-tags） */
.sel-multi{display:inline-flex;align-items:center;gap:6px;min-width:220px;height:32px;padding:3px 8px;border:1px solid var(--line2);border-radius:var(--r-xs);background:#fff;font-size:12px;color:var(--text)}
.sel-multi>span{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:var(--r-xs);background:rgba(0,113,227,.1);color:var(--blue);font-size:11.5px}
.sel-multi>span.mono{background:#f0f2f5;color:var(--text2)}
.chip.pp{background:rgba(175,82,218,.1);color:#8944ab}
/* DC-001 穿透查询：图 + 表明细（走查 #13） */
.dc-trace-split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;min-height:420px}
.dc-trace-split.single-graph{grid-template-columns:1fr}
.dc-trace-split.single-list{grid-template-columns:1fr}
.dc-graph-panel,.dc-list-panel{min-height:380px;display:flex;flex-direction:column}
.dc-graph-svg-wrap{flex:1;overflow:auto;padding:8px 4px}
.dc-node-g rect.dc-node-hl{stroke-width:2.4!important;filter:drop-shadow(0 0 4px rgba(0,113,227,.35))}
.dc-rel-bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;align-items:center}
.dc-rel-bar .lbl{font-size:12px;color:var(--text2);margin-right:4px}
/* IP 组：左树右详情（对齐 OPS P-M1-001） */
.ipg-split{display:grid;grid-template-columns:minmax(252px,30%) 1fr;gap:14px;align-items:stretch}
.ipg-tree-panel.card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:540px}
.ipg-tree-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.ipg-tree-search{padding:10px 12px;border-bottom:1px solid var(--line)}
.ipg-tree-search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:8px;padding:0 10px 0 32px;font-size:12.5px;outline:none;font-family:var(--font)}
.ipg-tree-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.ipg-tree-search .ico{position:relative}
.ipg-tree-search .ico svg{position:absolute;left:10px;top:8px;color:var(--text2);pointer-events:none}
.ipg-tree-body{flex:1;overflow-y:auto;padding:6px 8px 14px}
.ipg-node{display:flex;align-items:flex-start;gap:4px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.45;user-select:none}
.ipg-node:hover{background:rgba(0,0,0,.04)}
.ipg-node.on{background:var(--blue-bg);color:var(--blue);font-weight:500}
.ipg-node .exp{flex:none;width:18px;color:var(--text2);cursor:pointer;padding:1px 0}
.ipg-node .exp.ph{visibility:hidden}
.ipg-node .nm{flex:1;min-width:0}
.ipg-node .cnt{color:var(--text2);font-weight:400;font-size:12px}
.ipg-node .lv{font-size:10px;border:1px solid rgba(0,113,227,.35);color:var(--blue);padding:0 5px;border-radius:4px;margin-left:4px;font-weight:500;white-space:nowrap}
.ipg-node.child{margin-left:14px}
.ipg-detail-panel.card{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:540px}
.ipg-detail-hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.ipg-detail-hd h2{font-size:22px;font-weight:700;letter-spacing:-.4px;margin:8px 0 6px;line-height:1.2}
.ipg-detail-meta{font-size:12.5px;color:var(--text2);display:flex;flex-wrap:wrap;gap:6px 16px}
.ipg-detail-body{flex:1;padding:0 20px 20px;overflow-y:auto}
.ipg-detail-body .tabs{margin-top:0}
.ipg-info-grid{width:100%;border-collapse:collapse;font-size:13px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:4px}
.ipg-info-grid td{padding:11px 14px;border:1px solid var(--line);vertical-align:middle}
.ipg-info-grid .lbl{background:#fafafc;color:var(--text2);width:16%;font-size:12px;font-weight:500}
.ipg-empty-detail{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text2);font-size:13px}
.photo{height:170px;border-radius:10px;background:linear-gradient(135deg,#e9f2fc,#d6e7f8);display:flex;align-items:center;justify-content:center;color:#a6bdd6;margin-bottom:14px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.formrow.one{grid-template-columns:1fr}
.fld label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;height:34px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 10px;font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s;background:#fff}
.fld textarea{height:auto;padding:8px 10px;resize:vertical;min-height:70px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.lv{font-size:12px;padding:1px 7px;border-radius:4px;font-weight:600}

/* ===================== 交互增强：确认弹窗 / 表单 / 下载条 ===================== */
.cfwrap{position:fixed;inset:0;z-index:180;display:none}
.cfwrap.on{display:block}
.cfmask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.cfcard{position:absolute;top:50%;left:50%;transform:translate(-50%,-48%) scale(.96);opacity:0;width:420px;max-width:calc(100vw - 48px);background:#fff;border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.22);padding:20px 22px 16px;animation:cfIn .26s var(--spring) forwards;border:1px solid var(--line)}
@keyframes cfIn{to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cf-t{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;letter-spacing:-.2px}
.cf-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--blue-bg);color:var(--blue);flex:none}
.cfcard.danger .cf-ic{background:rgba(255,59,48,.12);color:var(--red)}
.cf-warn{display:flex;align-items:center;gap:7px;margin-top:12px;padding:9px 11px;border-radius:8px;background:rgba(255,59,48,.08);color:#d70015;font-size:12.5px;font-weight:500;line-height:1.5}
.cf-m{margin-top:12px;font-size:13px;color:var(--text2);line-height:1.6}
.cf-f{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#ff453a;transform:translateY(-1px);box-shadow:0 4px 10px rgba(255,59,48,.3)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex:none}
.btn-sec .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
.dlbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;box-shadow:0 10px 36px rgba(0,0,0,.18);padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:230;animation:tin .3s var(--spring);font-size:13px;border:1px solid var(--line)}
.dlbar.fadeout{opacity:0;transform:translateX(-50%) translateY(10px);transition:all .4s}
.dlbar .dl-t{display:flex;flex-direction:column;line-height:1.35}
.dlbar .dl-t b{font-size:13px}
.dlbar .dl-t small{font-size:11px;color:var(--text2)}
.dlbar svg{color:var(--blue)}
.dl-act{color:var(--blue);cursor:pointer;font-weight:600;font-size:12.5px;padding:4px 8px;border-radius:5px}
.dl-act:hover{background:var(--blue-bg)}
.dl-x{cursor:pointer;color:var(--text2);display:flex;padding:4px;border-radius:4px;transition:all .15s}
.dl-x:hover{background:var(--bg);color:var(--text)}
.fld.wide{grid-column:1 / -1}
.fld .ferr{font-size:12px;color:var(--red);margin-top:4px;min-height:0;line-height:1.3}
.fld input.err,.fld select.err,.fld textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.12)}
.fld{position:relative}
.fld .unit{position:absolute;right:10px;bottom:9px;font-size:12px;color:var(--text2);pointer-events:none}
.fld .req{color:var(--red);font-style:normal;margin-left:2px}
.fup{display:flex;align-items:center;justify-content:center;gap:7px;height:64px;border:1.5px dashed var(--line2);border-radius:8px;color:var(--text2);font-size:12.5px;cursor:pointer;transition:all .15s;background:rgba(0,0,0,.015)}
.fup:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill input{display:none}
.pill span{display:inline-flex;align-items:center;height:30px;padding:0 14px;border:1px solid var(--line2);border-radius:980px;font-size:12.5px;cursor:pointer;transition:all .15s;background:#fff;color:var(--text2);user-select:none}
.pill:hover span{border-color:rgba(0,113,227,.4);color:var(--blue)}
.pill.on span{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.okwrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 10px 22px}
.okwrap b{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:14px}
.okno{margin-top:14px;display:flex;flex-direction:column;gap:2px}
.okno small{font-size:11px;color:var(--text2);letter-spacing:1px}
.okno .mono{font-size:15px;color:var(--blue);font-weight:600}
.okex{margin-top:10px;font-size:12.5px;color:var(--text2);line-height:1.6}
.rowflash td{animation:rowfl 2s ease}
@keyframes rowfl{0%{background:rgba(0,113,227,.18)}100%{background:transparent}}
tr.rowflash:hover td{animation:none}
.dag-wrap{display:grid;grid-template-columns:168px minmax(0,1fr) 292px;gap:12px;min-height:540px;align-items:stretch}
.dag-pal,.dag-prop{border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);padding:10px}
.dag-prop{background:#fff}
.dag-pal h4,.dag-prop h4{font-size:12px;font-weight:600;margin-bottom:8px}
.dag-item{padding:9px 10px;border:1.5px dashed var(--line2);border-radius:8px;margin-bottom:8px;cursor:grab;background:#fff;font-size:12.5px}
.dag-item:hover{border-color:var(--blue);color:var(--blue)}
.dag-item small{display:block;font-size:11px;color:var(--text2);margin-top:2px;font-weight:400}
.dag-canvas{position:relative;border:1px solid var(--line);border-radius:var(--r-s);background:linear-gradient(#fafafa 1px,transparent 1px),linear-gradient(90deg,#fafafa 1px,transparent 1px),#fff;background-size:24px 24px;min-height:540px;overflow:auto;user-select:none}
.dag-svg{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.dag-node{position:absolute;width:156px;padding:9px 11px;background:#fff;border:1.5px solid var(--line2);border-radius:10px;box-shadow:var(--sh);cursor:grab;z-index:2}
.dag-node.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.16)}
.dag-node .dn{font-size:12.5px;font-weight:600;line-height:1.3}
.dag-node .dt{font-size:11px;color:var(--text2);margin-top:3px}
.dag-tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.menu-tree .mi{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px}
.menu-tree .mi:hover{background:var(--bg)}
.menu-tree .indent{display:inline-block;width:18px}
.qt-wiz-steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 14px;background:#fafafc;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:16px}
.qt-wiz-step{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2)}
.qt-wiz-step i{width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-style:normal;color:var(--text2)}
.qt-wiz-step.on{color:var(--blue);font-weight:500}
.qt-wiz-step.on i{background:var(--blue);border-color:var(--blue);color:#fff}
.qt-wiz-step.done{color:var(--text)}
.qt-wiz-step.done i{background:#e8f7ed;border-color:var(--green);color:var(--green)}
.qt-wiz-sep{color:var(--text2);font-size:12px;opacity:.6}
.qt-wiz-pane{min-height:220px}
.qt-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qt-type-card{border:1.5px solid var(--line2);border-radius:var(--r);padding:16px 18px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.qt-type-card:hover{border-color:var(--blue)}
.qt-type-card.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.14)}
.qt-type-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qt-type-hd b{font-size:14px;font-weight:600}
.qt-type-card ul{margin:10px 0 0 0;padding-left:16px}
.qt-type-card li{font-size:12.5px;color:var(--text2);line-height:1.7}
.qt-type-pick{margin-top:12px;font-size:12px;color:var(--blue);font-weight:500}
.qt-wiz-foot{display:flex;align-items:center;gap:8px;width:100%}
.qt-wiz-foot .sp{flex:1}
.qt-wiz-done{text-align:center;padding:20px 0}
.qt-wiz-done-ic{width:52px;height:52px;border-radius:50%;background:#e8f7ed;color:var(--green);font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.qt-wiz-done-hd{font-size:15px;font-weight:600;margin-bottom:6px}
/* ===== 查询工具向导 · 控件样式统一（对齐抽屉表单 .fld 基线：34px / 8px / 13px） =====
   wizard 内容渲染在 drawer 内的 .qt-wiz 容器里，不带 .page-query-tool / .bi0-qb-root 祖先，
   故此处显式给 下拉框 / 文本框 / 多行文本 统一外观，避免原生控件与表单控件混用。 */
.drawer-b .qt-wiz input:not([type=radio]):not([type=checkbox]),
.drawer-b .qt-wiz select,
.drawer-b .qt-wiz textarea,
.drawer-b .qt-wiz .qt-qctl{height:34px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 10px;font-size:13px;font-family:var(--font);background:#fff;color:var(--text);outline:none;box-sizing:border-box;max-width:100%;vertical-align:middle;transition:border-color .15s,box-shadow .15s}
.drawer-b .qt-wiz textarea{height:auto;min-height:70px;padding:8px 10px;line-height:1.6;resize:vertical}
.drawer-b .qt-wiz input:focus,
.drawer-b .qt-wiz select:focus,
.drawer-b .qt-wiz textarea:focus,
.drawer-b .qt-wiz .qt-qctl:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.drawer-b .qt-wiz input[readonly],
.drawer-b .qt-wiz input[disabled],
.drawer-b .qt-wiz select[disabled]{background:#f5f5f7;color:var(--text2);cursor:not-allowed}
.drawer-b .qt-wiz input.err,
.drawer-b .qt-wiz select.err,
.drawer-b .qt-wiz textarea.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.12)}
/* 与控件同行排列的按钮（如「关键词 · 筛选」）高度对齐控件基线 */
.drawer-b .qt-wiz .qb-row .btn{height:34px}
</style>
</head>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>

/* 表格通用过滤：norm(row, index)->文本数组；status(row, index)->状态字符串 */
function qFilter(src, norm, status) {

  if (g.init) return src;
  const list = src.filter(function (r, i) {
    let ok = true;
    g.vals.forEach(function (v, j) {
      if (!ok || !v) return;
      if (/^全部|^同步状态|^档案状态|^到期状态|^分摊状态$|^穿透/.test(v)) return;
      const n = norm(r, i, j), s = status(r, i, j);
      /* 状态字段（含复合串 '抖音|冻结'）做包含匹配：下拉选值命中任一状态分量即通过 */
      if (s) {
        const parts = String(s).split('|');
        if (parts.indexOf(v) >= 0 || v === s) return;
        if (/(已|待|池|冻结|在用|闲置|维修|报废|归还|注销|结束|取消|开播|直播中|进行中|报名中|已归档|审核中|过期|补交|提交|草稿|迟交|已恢复|已忽略|未处理|处理中|结算|红|橙|黄)/.test(v)) { ok = false; return; }
      }

  });

/* fields: [{k:字段名,label,type:(text|date|num|select|dt|file|textarea|pills),req,opts,val,ph,pre,unit,disabled}] */
function frow(fields) {
  return fields.map(function (f) {
    const pid = 'F_' + f.k;
    let inner;
    if (f.type === 'select') inner = '<select id="' + pid + '"' + (f.chg ? ' onchange="' + f.chg + '"' : '') + (f.disabled ? ' disabled' : '') + '>' + f.opts.map(function (o) { return '<option' + (o === f.val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
    else if (f.type === 'textarea') inner = '<textarea id="' + pid + '" placeholder="' + (f.ph || '') + '">' + (f.val || '') + '</textarea>';
    else if (f.type === 'pills') inner = '<div class="pills">' + f.opts.map(function (o, i) { return '<label class="pill' + (o === f.val ? ' on' : '') + '"><input type="radio" name="P_' + f.k + '" value="' + o + '"' + (o === f.val ? ' checked' : '') + ' onchange="pillSel(this)"><span>' + o + '</span></label>'; }).join('') + '</div>';
    else if (f.type === 'file') inner = '<label class="fup" id="' + pid + '">' + ic('plus', 15) + '<input type="file" style="display:none" onchange="frowFilePicked(this,\'' + f.k + '\')"><span id="FT_' + f.k + '">' + (f.ph || '点击上传照片 / 附件') + '</span></label>';
    else if (f.type === 'pre') inner = '<input id="' + pid + '" value="' + (f.val || '') + '" oninput="' + f.pre + '" placeholder="' + (f.ph || '') + '"' + (f.disabled ? ' readonly' : '') + '>';
    else inner = '<input id="' + pid + '" type="' + (f.type === 'date' ? 'date' : f.type === 'dt' ? 'datetime-local' : f.type === 'num' ? 'number' : 'text') + '" value="' + (f.val != null ? f.val : '') + '" placeholder="' + (f.ph || '') + '" style="' + (f.unit ? 'padding-right:32px' : '') + '"' + (f.disabled ? ' readonly' : '') + '>' + (f.unit ? '<span class="unit">' + f.unit + '</span>' : '');
    return '<div class="fld' + (f.wide ? ' wide' : '') + '"><label>' + f.label + (f.req ? '<i class="req">*</i>' : '') + '</label>' + inner + '<div class="ferr" id="E_' + f.k + '"></div>' + (f.hint ? '<div class="hint">' + f.hint + '</div>' : '') + '</div>';
  }).join('');
}

function acctChargeCalc() {

  if ($('#ccR')) $('#ccR').textContent = real ? fmtMoney(real) : '—';
  const d = $('#ccD');
  if (d) {
    if (!amt || !real) { d.textContent = '待输入'; d.style.color = ''; }
    else if (amt === real) { d.textContent = '✓ 账实一致'; d.style.color = 'var(--green)'; }
    else { d.textContent = '⚠ 差异 ' + fmtMoney(Math.abs(amt - real)) + '，需说明原因'; d.style.color = 'var(--red)'; }
  }
}

function sopHasCycle() {
  const map = {};

  const st = {};

    if (st[id] === 1) return id;
    if (st[id] === 2) return null;
    st[id] = 1;

    for (let i = 0; i < ps.length; i++) { const hit = dfs(ps[i]); if (hit) return hit; }
    st[id] = 2;
    return null;

function sopDagAuto() {

    if (!n || !(n.pred || []).length) { lv[id] = 0; return 0; }

    (n.pred || []).forEach(function (p) { m = Math.max(m, level(p, guard + 1) + 1); });

/* ===================== MEET-004 会议纪要管理 ===================== */
/* 纪要详情抽屉：已生成→内容+决议待办+归档；AI 转写中→进度；待生成→触发 AI 生成 */
function meetDetail(id) {
  const m = MEETS.filter(function (x) { return x.id === id; })[0];
  if (!m) return;
  let body = '<div class="kv">' +
    '<div><div class="k">会议编号</div><div class="v mono">' + m.id + '</div></div>' +
    '<div><div class="k">主题</div><div class="v">' + m.topic + '</div></div>' +
    '<div><div class="k">组织者</div><div class="v">' + sens(m.org) + '</div></div>' +
    '<div><div class="k">时间 / 时长</div><div class="v">' + m.time + ' · ' + m.dur + '</div></div>' +
    '<div><div class="k">会议室</div><div class="v">' + m.room + '</div></div>' +
    '<div><div class="k">参会人数</div><div class="v">' + m.ppl + ' 人</div></div></div>';
  if (m.min === '已生成' || m.min === '已归档') {
    /* 纪要正文 + 决议待办 */
    body += '<div class="dsec">纪要正文' + (m.min === '已归档' ? '（已归档 · 只读）' : '') + '</div>' +
      '<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:12px 14px;font-size:12.5px;line-height:1.7;color:var(--text)">' + (m.minBody || '（纪要内容待补充）') + '</div>';
    const decs = m.decisions || [];
    body += '<div class="dsec">决议事项 → 待办（' + decs.length + ' 项）</div>';
    if (decs.length) {
      body += '<div class="tl">' + decs.map(function (d) {
        return '<div class="tl-i gg"><div class="tt" style="font-size:12.5px">' + d.d + '</div><div class="td">截止 ' + d.due + ' · 已转待办（钉钉待办 + 工作台待办中心）</div></div>';
      }).join('') + '</div>';
    } else {
      body += '<div class="hint">本次会议无决议事项</div>';
    }
    const foot = '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>' +
      (m.min === '已生成' ? '<button class="btn btn-sec" onclick="meetMinEdit(\'' + m.id + '\')">编辑纪要</button>' +
        '<button class="btn btn-pri" onclick="meetMinArchive(\'' + m.id + '\')">归档纪要</button>' : '');
    openDrawer('会议纪要 · ' + m.topic, body, foot, '560px');
  } else if (m.min === 'AI 转写中') {
    /* AI 转写进度 */
    body += '<div class="dsec">AI 纪要生成中</div>' +
      '<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:16px;text-align:center">' +
      '<span class="spin" style="display:inline-block;margin-bottom:8px"></span>' +
      '<div style="font-size:13px;font-weight:600">AI 听记转写中 · 约 3 分钟完成</div>' +
      '<div class="hint" style="margin-top:4px">转写完成后将自动提取决议事项并生成待办推送（MEET-004）</div>' +
      '<div class="rowline" style="justify-content:center;gap:8px;margin-top:10px">' +
      '<span class="btn btn-sec btn-sm" onclick="meetMinDone(\'' + m.id + '\')">模拟转写完成</span></div></div>';
    openDrawer('会议纪要 · ' + m.topic, body, '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>', '480px');
  } else {
    /* 待生成：触发 AI 生成 */
    body += '<div class="dsec">纪要状态</div>' +
      '<div class="card" style="box-shadow:none;border:1px dashed var(--line2);padding:16px;text-align:center">' +
      '<div style="font-size:13px;font-weight:600;color:var(--orange)">纪要尚未生成</div>' +
      '<div class="hint" style="margin-top:4px">可等待会议结束后 AI 自动生成，或上传录音/手动录入触发即时生成</div>' +
      '<div class="rowline" style="justify-content:center;gap:8px;margin-top:10px">' +
      '<span class="btn btn-pri btn-sm" onclick="meetMinGen(\'' + m.id + '\')">' + ic('bolt', 13) + ' 触发 AI 生成</span>' +
      '<span class="btn btn-sec btn-sm" onclick="meetMinManual(\'' + m.id + '\')">手动录入纪要</span></div></div>';
    openDrawer('会议纪要 · ' + m.topic, body, '<button class="btn btn-sec" onclick="closeDrawer()">关闭</button>', '480px');
  }
}

/* FLOW-002：看板节点流转（当前节点审批通过 → 下一节点；到链尾归档） */
function flowKbNext(i) {

/* FIN-001：成本项计入结算单（自动累加到总成本） */
function finCostAttach(i) {
  const c = FINCOSTS[i];
  if (!c) return;
  if (c.st !== '已审核') { toast('仅已审核成本项可计入', 'warn'); return; }
  const el = $('#F_cost');
  const cur = Number(el.value || 0);
  el.value = (cur + c.amt).toFixed(2);
  finCalc();
  toast('成本项已计入：' + c.type + ' ' + fmtMoney(c.amt) + '（总成本 ' + fmtMoney(cur + c.amt) + '）', 'success');
}
function finCalc() {
  const rev = Number($('#F_rev').value || 0), cost = Number($('#F_cost').value || 0), ratio = Number($('#F_ratio').value || 0);
  const profit = rev - cost;
  const share = profit > 0 ? profit * ratio / 100 : 0;
  const net = profit - share;
  $('#finP').textContent = fmtMoney(profit);
  $('#finP').className = 'v num' + (profit < 0 ? ' neg' : '');
  $('#finS').textContent = fmtMoney(share);
  const n = $('#finN');
  n.textContent = fmtMoney(net);
  n.className = 'v num ' + (net < 0 ? 'neg' : 'pos');
}
function finAddSubmit() {
  if (!formValidate(['sid', 'rev', 'cost', 'ratio'])) return;
  finCalc();
  const rev = Number($('#F_rev').value || 0), cost = Number($('#F_cost').value || 0), ratio = Number($('#F_ratio').value || 0);
  const no = 'FI202609-' + String(FINS.length + 21).padStart(3, '0');
  FINS.unshift({ id: no, sid: $('#F_sid').value.split(' ')[0], acct: 'ACCT-2026-0001', rev: rev, cost: cost, ratio: ratio, st: '待结算' });
  if (state.page === 'finCost' || state.page === 'fin') renderPage();
  formOk(no, '结算单已创建（待结算），净利润 ' + fmtMoney(rev - cost - (rev - cost > 0 ? (rev - cost) * ratio / 100 : 0)), '');
  toast('结算单发起成功：' + no, 'success');
}

function finRuleItemAdd(i) {
  const r = FINRULES[i];
  finRuleGrab(i);
  r.body.push({ role: '新角色', pct: 10 });
  finRuleEdit(i);
  toast('已添加分成项（当前 ' + r.body.length + ' 项）', 'success');

/* FIN-003：删除分成项 */
function finRuleItemDel(i, j) {
  const r = FINRULES[i];
  if (r.body.length <= 1) { toast('至少保留一个分成项', 'warn'); return; }
  finRuleGrab(i);
  r.body.splice(j, 1);
  finRuleEdit(i);
  toast('分成项已删除（剩余 ' + r.body.length + ' 项）', 'success');
}
/* FIN-003：从当前抽屉输入抓取到数据（编辑/增删前暂存） */
function finRuleGrab(i) {
  const r = FINRULES[i];
  r.body.forEach(function (b, j) {
    const roleEl = $('#RI_role' + j), pctEl = $('#RI_pct' + j);
    if (roleEl) b.role = roleEl.value.trim() || b.role;
    if (pctEl) b.pct = Number(pctEl.value || 0);
  });
  const nameEl = $('#F_rname');
  if (nameEl) r.name = nameEl.value.trim() || r.name;
  const modeEl = $('#F_rmode');
  if (modeEl) r.mode = modeEl.value;
}
/* FIN-003：保存规则（多方模式校验合计 ≤100%） */
function finRuleSave(i) {
  const r = FINRULES[i];
  finRuleGrab(i);
  if (!formValidate(['rname', 'rmode'])) return;
  const sum = r.body.reduce(function (s, b) { return s + b.pct; }, 0);
  if (r.mode === '多方' && sum > 100) {
    toast('多方分成比例合计 ' + sum + '% 超 100%，无法保存（FIN-003）', 'error');
    return;
  }
  if (r.body.some(function (b) { return b.pct < 0 || b.pct > 100; })) {
    toast('分成比例须在 0~100% 之间', 'error');
    return;
  }
  if (state.page === 'finCost' || state.page === 'fin') renderPage();
  closeDrawer();
  toast('分成规则已保存：' + r.no + ' · ' + r.name + '（' + r.mode + ' · 合计 ' + sum + '%）', 'success');
}

function paperSum() {

  cks.forEach(function (c) { sum += EXAMQ[Number(c.value)].sc; });
  const sp = $('#picksum'), hint = $('#pickhint'), err = $('#E_picks');
  if (sp) sp.textContent = sum;
  if (hint) hint.textContent = '已选 ' + cks.length + ' 题 · Σ = ' + sum + ' 分';
  if (err) {
    if (sum !== 100) { err.textContent = 'Σ 题目分须等于 100 分（当前 ' + sum + '，错误码 1159 前端预校验）'; err.style.color = 'var(--red)'; }

/* 同规则分组（去重口径：规则名相同即视为同源；返回 [{rule, n, list, lvs}] 按数量降序） */
function alertDedupGroups() {
  const map = {};
  const order = [];
  ALERTS.forEach(function (a) {
    if (!map[a.rule]) { map[a.rule] = { rule: a.rule, list: [] }; order.push(a.rule); }
    map[a.rule].list.push(a);
  });
  const groups = order.map(function (r) { return map[r]; });
  groups.forEach(function (g) { g.n = g.list.length; });
  groups.sort(function (x, y) { return y.n - x.n; });
  return groups;
}

  let rows = '';

/* 复制：优先剪贴板 API，沙箱/降级走选中文本 */
function airCopy(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast('已复制到剪贴板（' + txt.length + ' 字符）', 'success'); },
      function () { toast('复制失败，请手动选中文本复制', 'warn'); });
  } else toast('已复制到剪贴板（原型示意）', 'success');
}

function bi0SvgBars(series, opts) {

  [0, 0.25, 0.5, 0.75, 1].forEach(function (r) {
    const y = base - r * (base - 20);
    g += '<line x1="34" y1="' + y.toFixed(1) + '" x2="' + (w - 8) + '" y2="' + y.toFixed(1) + '" stroke="' + (r === 0 ? 'rgba(0,0,0,.10)' : 'rgba(0,0,0,.05)') + '"/>';
    g += '<text x="4" y="' + (y + 3.5).toFixed(1) + '" font-size="10" fill="#8a8f98">' + fmtNum(Math.round(max * r)) + '</text>';
  });
  series.forEach(function (s, i) {
    const bh = Math.max(2, (s.v / max) * (base - 20));
    const x = 42 + i * step, bw = Math.min(38, step * 0.55);
    g += '<rect x="' + x.toFixed(1) + '" y="' + (base - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="' + (opts.color || 'var(--blue)') + '" opacity="' + (0.5 + 0.5 * (s.v / max)).toFixed(2) + '"/>';
    g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (base - bh - 5).toFixed(1) + '" text-anchor="middle" font-size="10" fill="#5f6570">' + (s.t || s.v) + '</text>';
    g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (hh - 9) + '" text-anchor="middle" font-size="10.5" fill="#5f6570">' + s.k + '</text>';
  });

/* 折线图（与 bi0SvgBars 同风格、同主题安全色；series=[{k,v}]，按数组顺序连线） */
function bi0SvgLine(series) {

  const n = series.length;
  const span = rx - lx;
  const step = n > 1 ? span / (n - 1) : 0;
  const px = function (i) { return lx + i * step; };
  const py = function (v) { return base - (v / max) * (base - top); };
  let g = '<svg viewBox="0 0 ' + w + ' ' + hh + '" style="width:100%">';
  [0, 0.25, 0.5, 0.75, 1].forEach(function (r) {
    const y = base - r * (base - top);
    g += '<line x1="' + lx + '" y1="' + y.toFixed(1) + '" x2="' + rx + '" y2="' + y.toFixed(1) + '" stroke="' + (r === 0 ? 'rgba(0,0,0,.10)' : 'rgba(0,0,0,.05)') + '"/>';
    g += '<text x="4" y="' + (y + 3.5).toFixed(1) + '" font-size="10" fill="#8a8f98">' + fmtNum(Math.round(max * r)) + '</text>';
  });

    g += '<polygon points="' + area + '" fill="var(--blue)" opacity="0.07"/>';
  }
  g += '<polyline points="' + pts + '" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';

    g += '<text x="' + x.toFixed(1) + '" y="' + (hh - 9) + '" text-anchor="middle" font-size="10.5" fill="#5f6570">' + s.k + '</text>';

function bi0SvgPie(series) {

function opsContentSubmitReview(i) {

  confirmDlg('删除内容', 'DELETE /admin-api/ims/content/' + c.id + ' · Football status-change 下架后逻辑删。', '删除', function () {
    OPS_CONTENTS.splice(i, 1);
